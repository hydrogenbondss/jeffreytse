<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="ROLL CALL">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="shade" cx="52%" cy="34%" r="74%">
      <stop offset="0" stop-color="#171716"/>
      <stop offset="0.62" stop-color="#0c0c0b"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
  </defs>
  <rect width="960" height="720" fill="url(#shade)"/>
  <rect width="960" height="720" filter="url(#grain)" opacity="0.55"/>
  <g fill="#f4f0e7" font-family="Georgia, 'Times New Roman', serif" font-weight="400" text-anchor="middle">
    <text x="480" y="348" font-size="238" letter-spacing="-10">ROLL</text>
    <text x="480" y="578" font-size="238" letter-spacing="-10">CALL</text>
  </g>
  <rect x="416" y="665" width="128" height="2" fill="#8d6d34" opacity="0.85"/>
</svg>
