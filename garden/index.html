<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden of Returning</title>
<meta name="description" content="A living sanctuary where plants grow, bloom, die, and return. Built entirely in HTML/Canvas with procedural audio and generative poetry.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070b08;color:#dfe9d8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#070b08}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px}
.row{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}
.label{font-size:10px;line-height:1.75;letter-spacing:.2em;text-transform:uppercase;color:rgba(218,235,205,.55);text-shadow:0 1px 16px rgba(20,50,24,.55)}
.right{text-align:right}.quiet{color:rgba(218,235,205,.32)}
#enter{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 48%,rgba(70,98,63,.24),rgba(5,8,6,.96) 62%);transition:opacity .6s ease,visibility .6s ease}
#enter.hidden{opacity:0;visibility:hidden;pointer-events:none}
#enter button{pointer-events:auto;border:1px solid rgba(218,235,205,.28);background:rgba(8,13,9,.78);color:rgba(242,247,234,.86);border-radius:999px;padding:15px 28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 44px rgba(110,150,90,.15);transition:transform .16s ease-out,border-color .2s ease,background .2s ease}
#enter button:hover{border-color:rgba(235,245,224,.58);background:rgba(20,32,21,.82)}
#enter button:active{transform:scale(.97)}
#enter .subtitle{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(218,235,205,.3);text-align:center;line-height:1.8}
.reticle{position:fixed;left:50%;top:50%;z-index:4;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none;border:1px solid rgba(230,240,218,.25);border-radius:999px}
#poetry{position:fixed;bottom:18%;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;opacity:0;transition:opacity 2s ease}
#poetry.visible{opacity:1}
#poetry span{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(200,225,180,.45);font-style:italic}
@media(max-width:700px){#hud{padding:16px}.label{font-size:9px}.quiet{max-width:230px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div class="row">
    <div class="label">Garden of Returning<br>endless sanctuary</div>
    <div class="label right" id="coords">22.3193 N<br>114.1694 E</div>
  </div>
  <div class="row">
    <div class="label quiet">WASD / arrows to walk &middot; pointer to look &middot; scroll to continue</div>
    <div class="label right">Plants grow &middot; bloom &middot; die &middot; return<br>no exit found</div>
  </div>
</div>
<div class="reticle" aria-hidden="true"></div>
<div id="enter">
  <button id="start">Begin Walking</button>
  <div class="subtitle">Headphones recommended &middot; Plants grow, bloom, die, and return</div>
</div>
<div id="poetry"><span id="poemLine"></span></div>

<script>
// ─── Audio Engine ───
let audioCtx, ambientGain;
const poemPhrases=[
  "the quiet return of green","moss remembers what concrete forgot",
  "every bloom is a brief rebellion","vines write their own scripture",
  "the garden does not ask permission","what dies here also returns",
  "roots hold the memory of rain","silence is also a kind of growth",
  "the post-human is pre-plant","every seed is a question",
  "nature reclaims without anger","the cycle does not hurry"
];
let lastPoemTime=0,currentPoem="";

function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  
  // Wind noise
  const bufferSize=4096;
  const noiseNode=audioCtx.createScriptProcessor(bufferSize,1,1);
  let nSeed=0;
  noiseNode.onaudioprocess=function(e){
    const out=e.outputBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      nSeed=(nSeed*16807+0)%2147483647;
      out[i]=(nSeed/1073741823-1)*0.015;
    }
  };
  
  // Wind filter (bandpass for airy sound)
  const bp=audioCtx.createBiquadFilter();
  bp.type='bandpass';bp.frequency.value=400;bp.Q.value=0.5;
  const lp=audioCtx.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=1200;
  
  ambientGain=audioCtx.createGain();
  ambientGain.gain.value=0.12;
  
  noiseNode.connect(bp);bp.connect(lp);lp.connect(ambientGain);ambientGain.connect(audioCtx.destination);
  noiseNode.start&&noiseNode.start();
  
  // Subtle drone
  const osc=audioCtx.createOscillator();
  const og=audioCtx.createGain();
  osc.type='sine';osc.frequency.value=65;og.gain.value=0.02;
  osc.start();osc.connect(og);og.connect(audioCtx.destination);
}

const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");
const coords=document.getElementById("coords");
const poetryEl=document.getElementById("poetry");
const poemLineEl=document.getElementById("poemLine");
let W=0,H=0,DPR=1,cx=0,cy=0,last=performance.now(),time=0;
let distance=0,targetSpeed=0,speed=0,lateral=0,targetLateral=0,lookX=0,lookY=0,targetLookX=0,targetLookY=0;
const keys=new Set();

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize,{passive:true});resize();
function lerp(a,b,t){return a+(b-a)*t}
function fract(n){return n-Math.floor(n)}
function rand(n){return fract(Math.sin(n*91.345+17.31)*43758.5453123)}
function project(x,y,z){
  const f=740/(z+1);
  return {x:cx+(x+lateral*42)*f+lookX*88/z,y:cy+(y+lookY*22)*f,f};
}
function poly(points,fill,stroke,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
  ctx.restore();
}
function line(a,b,color,width,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.lineWidth=width||1;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
}

// ─── Sky ───
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#a9bbb7");
  g.addColorStop(.32,"#6f8680");
  g.addColorStop(.62,"#233329");
  g.addColorStop(1,"#071008");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sun=ctx.createRadialGradient(W*.58+lookX*30,H*.18,0,W*.58+lookX*30,H*.18,W*.46);
  sun.addColorStop(0,"rgba(245,245,225,.25)");
  sun.addColorStop(.34,"rgba(190,210,190,.08)");
  sun.addColorStop(1,"transparent");
  ctx.fillStyle=sun;ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){
    const x=(i*230-distance*.03+rand(i)*W)%(W+360)-180;
    const y=H*(.09+rand(i+2)*.22);
    const w=W*(.18+rand(i+4)*.28);
    const cg=ctx.createRadialGradient(x,y,0,x,y,w);
    cg.addColorStop(0,"rgba(235,245,230,.12)");
    cg.addColorStop(1,"transparent");
    ctx.fillStyle=cg;ctx.fillRect(x-w,y-w*.3,w*2,w*.7);
  }
  // Birds
  for(let i=0;i<5;i++){
    const bx=(i*400+time*8+rand(i)*W)%(W+100)-50;
    const by=H*(.08+rand(i+3)*.15)+Math.sin(time+i)*10;
    ctx.save();ctx.globalAlpha=0.15;
    ctx.strokeStyle='#8a9a82';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(bx-6,by);ctx.quadraticCurveTo(bx-3,by-3,bx,by);
    ctx.quadraticCurveTo(bx+3,by-3,bx+6,by);
    ctx.stroke();ctx.restore();
  }
}

// ─── Ground ───
function drawGround(){
  const horizon=H*.49+lookY*28;
  const roadTop=[project(-70,-10,90),project(70,-10,90)];
  const roadBot=[project(430,245,1),project(-430,245,1)];
  poly([roadTop[0],roadTop[1],roadBot[0],roadBot[1]],"#10170f",null,1);
  const wet=ctx.createLinearGradient(0,horizon,0,H);
  wet.addColorStop(0,"rgba(80,100,80,.05)");
  wet.addColorStop(1,"rgba(210,230,205,.12)");
  ctx.fillStyle=wet;ctx.fillRect(0,horizon,W,H-horizon);
  for(let i=0;i<22;i++){
    const z=((i*70-distance*1.2)%1600+1600)%1600+20;
    const x=(rand(i+44)-.5)*190;
    const p=project(x,170,z),q=project(x+60*(rand(i+3)-.5),186,z+120);
    line(p,q,`rgba(195,215,190,${.08*(1-z/1750)})`,Math.max(.4,p.f/140),1);
  }
}

// ─── Plant lifecycle ───
function plantLifecycle(seed,t){
  const cycle=(t*0.05+seed)%10;
  if(cycle<3)return {phase:'growing',scale:cycle/3};
  if(cycle<6)return {phase:'blooming',scale:1};
  if(cycle<8)return {phase:'dying',scale:1-(cycle-6)/2};
  return {phase:'returning',scale:(cycle-8)/2};
}

function drawRuin(seg,side){
  const z=seg.z,fade=Math.max(0,1-z/2300);
  const w=seg.w,h=seg.h,x=side*(seg.offset);
  const yBase=120;
  const p1=project(x,yBase,z),p2=project(x+side*w,yBase-18,z+60),p3=project(x+side*w,-h,z+60),p4=project(x,-h+seg.damage,z);
  poly([p1,p2,p3,p4],seg.color,`rgba(230,238,222,${.08*fade})`,.88*fade);
  const cols=Math.max(2,Math.floor(w/46)),rows=Math.max(2,Math.floor(h/48));
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(rand(seg.seed+r*17+c*9)<.2)continue;
      const wx=x+side*(18+c*(w-36)/cols);
      const wy=-h+36+r*(h-70)/rows;
      const a=project(wx,wy,z+20),b=project(wx+side*18,wy,z+23),c2=project(wx+side*18,wy+24,z+24),d=project(wx,wy+24,z+22);
      poly([a,b,c2,d],"rgba(0,5,3,.58)",`rgba(180,205,180,${.08*fade})`,fade);
    }
  }
  // Vines with lifecycle
  for(let v=0;v<seg.vines;v++){
    const vx=x+side*(20+rand(seg.seed+v)*Math.max(30,w-40));
    const top=-h+rand(seg.seed+v+9)*h*.35;
    const len=80+rand(seg.seed+v+4)*h*.75;
    let prev=project(vx,top,z+15);
    const life=plantLifecycle(seg.seed+v,time);
    const vineAlpha=life.scale;
    for(let k=1;k<8;k++){
      const yy=top+len*k/8;
      const xx=vx+side*Math.sin(time*.5+k+seg.seed)*18*k/8;
      const cur=project(xx,yy,z+15+k*4);
      const leafSize=Math.max(2,cur.f/80)*vineAlpha;
      line(prev,cur,`rgba(76,128,55,${.55*fade*vineAlpha})`,Math.max(.6,cur.f/120),1);
      if(k%2===0&&leafSize>0.5)drawLeaf(cur.x,cur.y,leafSize,fade*.8*vineAlpha,life.phase);
      prev=cur;
    }
  }
}

function drawLeaf(x,y,s,alpha,phase){
  ctx.save();ctx.globalAlpha=alpha;
  // Color shifts with lifecycle
  if(phase==='blooming')ctx.fillStyle="rgba(120,180,80,.82)";
  else if(phase==='dying')ctx.fillStyle="rgba(180,160,60,.72)";
  else if(phase==='returning')ctx.fillStyle="rgba(80,120,60,.55)";
  else ctx.fillStyle="rgba(74,130,55,.72)";
  ctx.beginPath();ctx.ellipse(x,y,s*2.4,s,Math.sin(x+y),0,Math.PI*2);ctx.fill();ctx.restore();
}

function drawTree(seed,z,side){
  const fade=Math.max(0,1-z/1900);
  const x=side*(140+rand(seed)*180),base=project(x,160,z),top=project(x+side*(rand(seed+1)-.5)*40,-110-rand(seed+2)*130,z+40);
  line(base,top,`rgba(53,43,34,${.75*fade})`,Math.max(2,base.f/36),1);
  const life=plantLifecycle(seed,time);
  for(let b=0;b<5;b++){
    const t=(b+1)/6;
    const bx=lerp(base.x,top.x,t),by=lerp(base.y,top.y,t);
    const ex=bx+side*(50+rand(seed+b)*100)*base.f/220;
    const ey=by-(20+rand(seed+b+2)*80)*base.f/220;
    line({x:bx,y:by},{x:ex,y:ey},`rgba(54,49,36,${.45*fade})`,Math.max(.8,base.f/90),1);
    for(let l=0;l<7;l++){
      const leafS=Math.max(2,base.f/95)*life.scale;
      if(leafS>0.5)drawLeaf(ex+(rand(seed+l)-.5)*44*base.f/220,ey+(rand(seed+l+7)-.5)*30*base.f/220,leafS,fade*.8,life.phase);
    }
  }
}

function drawVegetation(){
  for(let i=0;i<100;i++){
    const z=((i*43-distance*1.45)%1700+1700)%1700+12;
    const side=rand(i)>.5?1:-1;
    const x=side*(78+rand(i+2)*330);
    const p=project(x,182,z);
    const s=Math.max(1.2,p.f/54)*(1+rand(i+5)*2.2);
    if(p.x<-80||p.x>W+80||p.y<0||p.y>H+100)continue;
    const life=plantLifecycle(i*0.7,time);
    ctx.strokeStyle=`rgba(${60+rand(i)*40},${110+rand(i+1)*75},${50+rand(i+2)*40},${.5*(1-z/1750)*life.scale})`;
    ctx.lineWidth=Math.max(.5,s*.35);
    for(let g=0;g<5;g++){
      ctx.beginPath();
      ctx.moveTo(p.x+g*s*.9,p.y);
      ctx.quadraticCurveTo(p.x+(g-2)*s*2+Math.sin(time+i)*s,p.y-s*7,p.x+(g-2)*s*4,p.y-s*(13+rand(i+g)*8));
      ctx.stroke();
    }
    // Small flowers when blooming
    if(life.phase==='blooming'&&p.f>20){
      ctx.save();ctx.globalAlpha=0.35*(1-z/1700);
      ctx.fillStyle=`hsla(${40+rand(i)*60},60%,70%,0.6)`;
      ctx.beginPath();ctx.arc(p.x,p.y-s*12,Math.max(1,s*0.3),0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
}

function sceneSegments(){
  const arr=[];
  const step=190,base=distance%step;
  for(let i=-1;i<18;i++){
    const world=Math.floor(distance/step)+i;
    const z=i*step-base+90;
    arr.push({
      z,seed:world*11.73,w:95+rand(world)*130,h:170+rand(world+4)*260,
      offset:185+rand(world+8)*170,damage:rand(world+9)*90,
      vines:3+Math.floor(rand(world+7)*7),
      color:`hsl(${82+rand(world)*40},${6+rand(world+3)*8}%,${12+rand(world+2)*14}%)`
    });
  }
  return arr;
}

function drawWorld(){
  drawSky();
  const segs=sceneSegments().sort((a,b)=>b.z-a.z);
  drawGround();
  segs.forEach((seg,i)=>{
    if(i%3===0)drawTree(seg.seed+4,seg.z+20,-1);
    if(i%4===0)drawTree(seg.seed+8,seg.z+50,1);
    drawRuin(seg,-1);
    drawRuin({...seg,w:seg.w*(.82+rand(seg.seed)*.5),h:seg.h*(.8+rand(seg.seed+2)*.5),offset:seg.offset*(.86+rand(seg.seed+3)*.4),seed:seg.seed+99},1);
  });
  drawVegetation();
  const fog=ctx.createLinearGradient(0,H*.38,0,H);
  fog.addColorStop(0,"rgba(180,205,185,.10)");
  fog.addColorStop(.45,"rgba(130,160,130,.08)");
  fog.addColorStop(1,"rgba(4,7,4,.42)");
  ctx.fillStyle=fog;ctx.fillRect(0,H*.36,W,H*.64);
  const vig=ctx.createRadialGradient(cx,cy,H*.18,cx,cy,Math.max(W,H)*.78);
  vig.addColorStop(0,"transparent");vig.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  
  // Poetry
  if(time-lastPoemTime>12){
    currentPoem=poemPhrases[Math.floor(Math.random()*poemPhrases.length)];
    poemLineEl.textContent=currentPoem;
    poetryEl.classList.add('visible');
    lastPoemTime=time;
    setTimeout(()=>poetryEl.classList.remove('visible'),6000);
  }
}

function update(dt){
  targetSpeed=0;
  if(keys.has("w")||keys.has("arrowup"))targetSpeed=155;
  if(keys.has("s")||keys.has("arrowdown"))targetSpeed=-80;
  if(!keys.size)targetSpeed=28;
  if(keys.has("a")||keys.has("arrowleft"))targetLateral+=dt*2;
  if(keys.has("d")||keys.has("arrowright"))targetLateral-=dt*2;
  targetLateral=Math.max(-2.4,Math.min(2.4,targetLateral));
  speed=lerp(speed,targetSpeed,.045);
  lateral=lerp(lateral,targetLateral,.08);
  lookX=lerp(lookX,targetLookX,.08);
  lookY=lerp(lookY,targetLookY,.08);
  distance+=speed*dt;
  time+=dt;
  coords.innerHTML=(22.3193+distance*.00002).toFixed(4)+" N<br>"+(114.1694+Math.sin(distance*.002)*.018).toFixed(4)+" E";
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);drawWorld();requestAnimationFrame(frame);
}
addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("mousemove",e=>{targetLookX=(e.clientX/W-.5)*2;targetLookY=(e.clientY/H-.5)*2;});
addEventListener("wheel",e=>{distance+=e.deltaY*.9;},{passive:true});
let touchY=null;
addEventListener("touchstart",e=>{touchY=e.touches[0].clientY;},{passive:true});
addEventListener("touchmove",e=>{if(touchY!=null){distance+=(touchY-e.touches[0].clientY)*1.3;touchY=e.touches[0].clientY;}},{passive:true});
document.getElementById("start").addEventListener("click",()=>{
  document.getElementById("enter").classList.add("hidden");
  canvas.requestPointerLock&&canvas.requestPointerLock();
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
});
requestAnimationFrame(frame);
</script>
</body>
</html>
