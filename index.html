        const [isLoaded, setIsLoaded] = useState(false);
        const [isInView, setIsInView] = useState(false);
        const containerRef = useRef(null);
        useEffect(() => {
            const observer = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setIsInView(true); observer.disconnect(); } }, { threshold: 0.1, rootMargin: '50px' });
            if (containerRef.current) observer.observe(containerRef.current);
            return () => observer.disconnect();
        }, []);
        return (
            <div ref={containerRef} className={`relative ${className}`}>
                {!isLoaded && <div className="video-skeleton"><div className="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin"></div></div>}
                <img src={poster} alt="" className={`video-poster ${isLoaded ? 'loaded' : ''}`} />
                {isInView && <video src={src} autoPlay muted loop playsInline poster={poster} onLoadedData={() => setIsLoaded(true)} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${isLoaded ? 'opacity-100' : 'opacity-0'}`} style={{willChange:'transform'}} />}
            </div>
        );
    });

    function useInView(ref, options = {}) {
        const [isInView, setIsInView] = useState(false);
        useEffect(() => {
            const observer = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setIsInView(true); if (options.once !== false) observer.disconnect(); } }, { threshold: 0.1, ...options });
            if (ref.current) observer.observe(ref.current);
            return () => observer.disconnect();
        }, [ref, options.once]);
        return isInView;
    }

                                            {video.isPlayable && <span className="flex items-center gap-1 text-red-400 font-bold"><span className="live-dot"></span>LIVE</span>}
                                        </div>
                                        <h2 className="font-display text-2xl md:text-3xl font-bold mb-1">{video.title}</h2>
                                        <p className="text-sm text-gray-300 font-medium mb-2">{video.subtitle}</p>
                                        <p className="description text-sm text-gray-400 line-clamp-2 hidden md:block">{video.description}</p>
                                        {video.isPlayable && <span className="inline-flex items-center gap-1 text-xs text-green-400 mt-2 font-medium bg-green-400/10 px-2 py-1 rounded-full"><i data-lucide="play" className="w-3 h-3"></i>Click to Play</span>}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>

                {/* ABOUT */}
                <section id="about" className="py-24 bg-white dark:bg-black">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid md:grid-cols-3 gap-16">
                            <div className="md:col-span-1">
                                <div className="aspect-[3/4] rounded-2xl overflow-hidden bg-gray-100 dark:bg-gray-900 sticky top-24">
                                    <img src={PROFILE_IMAGE} alt="Jeffrey Nicholas Tse" className="w-full h-full object-cover" onError={(e) => { e.target.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80'; }} />
                                </div>
                            </div>
                            <div className="md:col-span-2 space-y-8">
                                <div>
                                    <p className="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">Practice</p>
                                    <h2 className="font-display text-4xl font-bold text-gray-900 dark:text-white mb-6">Jeffrey Nicholas Tse</h2>
                                    <div className="space-y-4">
                                        <p className="text-lg leading-relaxed text-gray-600 dark:text-gray-400">Interdisciplinary artist, systems designer, and researcher whose work investigates how human presence is reshaped through systems of observation, classification, memory, and mediation. Working across archival interfaces, curatorial practice, AI-assisted interaction systems, writing, and interactive media.</p>
                                        <p className="text-lg leading-relaxed text-gray-600 dark:text-gray-400">His practice began through curatorial and research-based investigations into intimacy, belonging, and spectatorship — across five exhibitions in Vancouver and Hong Kong. Published research has examined the ethics of documentary violence and how dating platforms reshape identity through systems of visibility and behavioral feedback.</p>
                                        <p className="text-lg leading-relaxed text-gray-600 dark:text-gray-400">These concerns have expanded into interactive systems and computational media. Current works — including ROLL CALL, RE/SENSE, and PawsAid — involve archives, AI-assisted interaction, and longitudinal memory structures. Across these projects, systems are approached not as neutral tools but as environments that shape how people understand themselves and others.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-4 pt-2">
                                    <div className="p-5 rounded-2xl bg-gray-50 dark:bg-gray-950 border border-gray-100 dark:border-gray-900">
                                        <div className="font-display text-3xl font-bold mb-1 text-gray-900 dark:text-white">5</div>
                                        <div className="text-xs text-gray-500 leading-tight">Exhibitions Curated</div>
                                    </div>
                                    <div className="p-5 rounded-2xl bg-gray-50 dark:bg-gray-950 border border-gray-100 dark:border-gray-900">
                                        <div className="font-display text-3xl font-bold mb-1 text-gray-900 dark:text-white">3</div>
                                        <div className="text-xs text-gray-500 leading-tight">Ventures Founded</div>
                                    </div>
                                    <div className="p-5 rounded-2xl bg-gray-50 dark:bg-gray-950 border border-gray-100 dark:border-gray-900">
                                        <div className="font-display text-3xl font-bold mb-1 text-gray-900 dark:text-white">7+</div>
                                        <div className="text-xs text-gray-500 leading-tight">Years Creative Practice</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                {/* MARQUEE */}
                <section className="py-10 bg-black text-white overflow-hidden border-y border-gray-900">
                    <div className="flex animate-marquee whitespace-nowrap">
                        {[...clients,...clients,...clients].map((c, i) => <span key={i} className="mx-8 font-display text-2xl font-bold text-gray-700 hover:text-white transition-colors cursor-default">{c}</span>)}
                    </div>
                </section>

                {/* WORKS */}
                <div id="selected-works" className="sticky top-16 z-30 bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                        <div className="flex items-center justify-between gap-4">
                            <h2 className="font-display text-lg font-bold hidden md:block text-gray-900 dark:text-white shrink-0">Selected Works</h2>
                            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                                {[{id:'all',label:'All Work'},{id:'ventures',label:'Ventures'},{id:'fashion',label:'Fashion'},{id:'tech',label:'Tech / AI'},{id:'commercial',label:'Commercial'}].map(btn => (
                                    <button key={btn.id} onClick={() => setFilter(btn.id)} className={`filter-btn whitespace-nowrap ${filter === btn.id ? 'active' : ''} ${darkMode ? 'border-gray-700 text-gray-300' : 'border-gray-300 text-gray-600'}`}>{btn.label}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>

                <section className="py-12 md:py-20 bg-white dark:bg-black">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12">
                            {sortedProjects.map((project, index) => <ProjectCard key={project.title} project={project} index={index} onSelect={setSelectedProject} />)}
                        </div>
                    </div>
                </section>

                {/* CURATORIAL */}
                <section id="curatorial" className="py-24 bg-gray-50 dark:bg-gray-950 border-t border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <p className="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">Practice</p>
                        <h2 className="font-display text-4xl font-bold text-gray-900 dark:text-white mb-4">Curatorial Work</h2>
                        <p className="text-lg text-gray-500 dark:text-gray-500 mb-12 max-w-2xl">Five exhibitions across Vancouver and Hong Kong examining home, belonging, traces, intimacy, memory, and the politics of visibility.</p>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {curatorial.map((ex, i) => (
                                <motion.div key={ex.title} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.4, delay: i * 0.07 }}
                                    className="p-6 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-black hover:border-gray-400 dark:hover:border-gray-600 transition-colors">
                                    <div className="flex items-start justify-between mb-3">
                                        <span className="text-xs font-semibold uppercase tracking-wider text-gray-400">{ex.year}</span>
                                        {ex.type === 'lead' ?
                                            <span className="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-900 text-gray-500">Curator</span> :
                                            <span className="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-900 text-gray-500">Co-Curator</span>
                                        }
                                    </div>
                                    <h3 className="font-display text-xl font-bold text-gray-900 dark:text-white mb-1">{ex.title}</h3>
                                    <p className="text-sm text-gray-400 dark:text-gray-500 mb-3">{ex.venue}, {ex.city}</p>
                                    <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">{ex.description}</p>
                                    {ex.artists.length > 0 && (
                                        <div>
                                            <p className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Featured Artists</p>
                                            <div className="flex flex-wrap gap-1">
                                                {ex.artists.map(a => <span key={a} className="text-xs px-2 py-0.5 rounded-full bg-gray-50 dark:bg-gray-900 text-gray-500 border border-gray-200 dark:border-gray-800">{a}</span>)}
                                            </div>
                                        </div>
                                    )}
                                    <div className="mt-4 flex flex-wrap gap-1">
                                        {ex.roles.map(r => <span key={r} className="text-xs text-gray-400 dark:text-gray-600">{r}{ex.roles.indexOf(r) < ex.roles.length - 1 ? ' ·' : ''}</span>)}
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>

                {/* RESEARCH */}
                <section id="research" className="py-24 bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <p className="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">Writing & Research</p>
                        <h2 className="font-display text-4xl font-bold text-gray-900 dark:text-white mb-4">Publications & Press</h2>
                        <p className="text-lg text-gray-500 dark:text-gray-500 mb-12 max-w-2xl">Research spanning spectatorship ethics, documentary violence, mediated intimacy, and digital identity performance.</p>
                        <div className="divide-y divide-gray-100 dark:divide-gray-900">
                            {publications.map((pub, i) => (
                                <motion.div key={pub.title} initial={{ opacity: 0, y: 16 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.4, delay: i * 0.08 }}
                                    className="py-8 flex flex-col md:flex-row md:items-start gap-6">
                                    <div className="md:w-36 shrink-0">
                                        <span className="text-xs font-semibold uppercase tracking-wider text-gray-400">{pub.year}</span>
                                        <div className="mt-1">
                                            {pub.type === 'research' && <span className="text-xs px-2 py-0.5 rounded-full bg-purple-50 dark:bg-purple-950 text-purple-500 border border-purple-200 dark:border-purple-900 font-medium">Research</span>}
                                            {pub.type === 'thesis' && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950 text-blue-500 border border-blue-200 dark:border-blue-900 font-medium">Thesis</span>}
                                            {pub.type === 'press' && <span className="text-xs px-2 py-0.5 rounded-full bg-green-50 dark:bg-green-950 text-green-500 border border-green-200 dark:border-green-900 font-medium">Press</span>}
                                        </div>
                                        {pub.presented && <p className="text-xs text-gray-400 mt-2">Symposium presenter</p>}
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-display text-lg font-bold text-gray-900 dark:text-white mb-1 leading-tight">{pub.title}</h3>
                                        <p className="text-sm text-gray-400 dark:text-gray-500 mb-3">{pub.venue}</p>
                                        <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">{pub.description}</p>
                                        {pub.links.length > 0 && (
                                            <div className="flex flex-wrap gap-3">
                                                {pub.links.map(l => (
                                                    <a key={l.url} href={l.url} target="_blank" rel="noopener noreferrer"
                                                        className="inline-flex items-center gap-1.5 text-xs font-medium text-gray-900 dark:text-white border border-gray-200 dark:border-gray-800 rounded-full px-3 py-1.5 hover:bg-gray-50 dark:hover:bg-gray-900 transition-colors">
                                                        {l.label}<i data-lucide="external-link" className="w-3 h-3"></i>
                                                    </a>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>

                {/* CONTACT */}
                <section id="contact" className="py-24 bg-gray-50 dark:bg-gray-950 border-t border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                        <h2 className="font-display text-4xl md:text-6xl font-bold mb-6 text-gray-900 dark:text-white">Let's work together</h2>
                        <p className="text-lg text-gray-500 dark:text-gray-500 mb-10 max-w-2xl mx-auto">Open to curatorial collaborations, research partnerships, freelance projects, and creative commissions.</p>
                        <a href="mailto:jeffreynicholast@gmail.com" className="inline-flex items-center gap-2 px-8 py-4 bg-black dark:bg-white text-white dark:text-black rounded-full font-medium hover:opacity-80 transition-opacity">
                            Get in Touch <i data-lucide="arrow-right" className="w-4 h-4"></i>
                        </a>
                        <div className="mt-12 flex justify-center gap-6">
                            <a href="https://github.com/hydrogenbondss" target="_blank" rel="noopener noreferrer" className="text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors"><i data-lucide="github" className="w-6 h-6"></i></a>
                            <a href="https://www.instagram.com/hydrogenbondss/" target="_blank" rel="noopener noreferrer" className="text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors"><i data-lucide="instagram" className="w-6 h-6"></i></a>
                        </div>
                    </div>
                </section>

                {/* FOOTER */}
                <footer className="py-8 bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <p className="text-sm text-gray-400">© 2026 Jeffrey Nicholas Tse. All rights reserved.</p>
                        <p className="text-sm text-gray-400">Built with React, Tailwind & Framer Motion</p>
                    </div>
                </footer>

                <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className={`back-to-top ${scrollY > 500 ? 'visible' : ''}`} aria-label="Back to top"><i data-lucide="arrow-up" className="w-5 h-5"></i></button>

                {/* MODAL */}
                <AnimatePresence>
                    {selectedProject && (
                        <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm overflow-y-auto" onClick={() => { setSelectedProject(null); setCurrentMediaIndex(0); }}>
                            <div className="min-h-screen md:flex md:items-center md:justify-center p-4 md:p-8">
                                <motion.div initial={{scale:.95,opacity:0}} animate={{scale:1,opacity:1}} exit={{scale:.95,opacity:0}} transition={{duration:.2}} className="w-full max-w-6xl bg-white dark:bg-gray-950 rounded-2xl overflow-hidden shadow-2xl border border-gray-200 dark:border-gray-800" onClick={e => e.stopPropagation()}>
                                    <div className="grid md:grid-cols-2">
                                        <div className="bg-black relative min-h-[300px] md:min-h-[600px]">
                                            {selectedProject.video && !selectedProject.hasMediaCarousel ? (
                                                <div className="modal-media-container">
                                                    {selectedProject.video.includes('youtube') ?
                                                        <iframe src={selectedProject.video} title={selectedProject.title} className="w-full h-full" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe> :
                                                        <video src={selectedProject.video} controls autoPlay className="max-h-full max-w-full" poster={selectedProject.image}></video>}
                                                </div>
                                            ) : selectedProject.hasMediaCarousel ? (
                                                <div className="media-carousel">
                                                    <AnimatePresence mode="wait">
                                                        <motion.div key={currentMediaIndex} initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} transition={{duration:.25}} className="carousel-slide">
                                                            {selectedProject.mediaItems[currentMediaIndex].type === 'youtube' ?
                                                                <iframe src={selectedProject.mediaItems[currentMediaIndex].url} title={selectedProject.mediaItems[currentMediaIndex].title} className="w-full h-full" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                                                            : selectedProject.mediaItems[currentMediaIndex].type === 'video' ?
                                                                <video src={selectedProject.mediaItems[currentMediaIndex].url} controls autoPlay className="max-h-full max-w-full rounded-lg" poster={selectedProject.mediaItems[currentMediaIndex].thumbnail}></video>
                                                            : selectedProject.mediaItems[currentMediaIndex].type === 'instagram' ? (
                                                                <div className="instagram-embed-container">
                                                                    {igLoading && <div className="instagram-skeleton"><i data-lucide="instagram" className="w-12 h-12 mb-4 animate-pulse"></i><p className="font-medium">Loading Instagram...</p></div>}
                                                                    <iframe src={`${selectedProject.mediaItems[currentMediaIndex].url}embed/`} title={selectedProject.mediaItems[currentMediaIndex].title} allowTransparency="true" allow="encrypted-media" onLoad={() => setIgLoading(false)} style={{opacity: igLoading ? 0 : 1, transition:'opacity 0.3s'}}></iframe>
                                                                </div>
                                                            ) : <img src={selectedProject.mediaItems[currentMediaIndex].url} alt={selectedProject.mediaItems[currentMediaIndex].title} className="max-h-full max-w-full object-contain rounded-lg" />}
                                                        </motion.div>
                                                    </AnimatePresence>
                                                    {selectedProject.mediaItems.length > 1 && <>
                                                        <button className="carousel-arrow prev" onClick={e => {e.stopPropagation();prevMedia();}}><i data-lucide="chevron-left" className="w-6 h-6"></i></button>
                                                        <button className="carousel-arrow next" onClick={e => {e.stopPropagation();nextMedia();}}><i data-lucide="chevron-right" className="w-6 h-6"></i></button>
                                                        <div className="carousel-nav">{selectedProject.mediaItems.map((_,idx) => <button key={idx} className={`carousel-dot ${idx===currentMediaIndex?'active':''}`} onClick={e=>{e.stopPropagation();setCurrentMediaIndex(idx);}} />)}</div>
                                                    </>}
                                                </div>
                                            ) : <div className="modal-media-container"><img src={selectedProject.image} alt={selectedProject.title} className="max-h-full max-w-full object-contain" /></div>}
                                        </div>
                                        <div className="p-8 md:p-12 flex flex-col">
                                            <div className="flex items-center justify-between mb-6">
                                                <Badge project={selectedProject} />
                                                <button onClick={() => {setSelectedProject(null);setCurrentMediaIndex(0);}} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors ml-auto"><i data-lucide="x" className="w-5 h-5"></i></button>
                                            </div>
                                            <div className="mb-6">
                                                <p className="text-xs text-gray-400 uppercase tracking-wider mb-2">{selectedProject.year}</p>
                                                <h2 className="font-display text-3xl md:text-4xl font-bold mb-2 text-gray-900 dark:text-white leading-tight">{selectedProject.title}</h2>
                                                <p className="text-sm text-gray-400 uppercase tracking-wider">{selectedProject.category}</p>
                                            </div>
                                            <div className="mb-8 flex-grow">
                                                <p className="text-gray-600 dark:text-gray-400 leading-relaxed">{selectedProject.fullDescription}</p>
                                                {selectedProject.role && <div className="mt-6 pt-6 border-t border-gray-100 dark:border-gray-800"><p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Role</p><p className="text-gray-700 dark:text-gray-300 font-medium">{selectedProject.role}</p></div>}
                                                {selectedProject.relatedLinks && <div className="mt-4 space-y-2">{selectedProject.relatedLinks.map(l => <a key={l.url} href={l.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-sm text-blue-500 hover:underline">{l.title}<i data-lucide="external-link" className="w-3 h-3"></i></a>)}</div>}
                                            </div>
                                            <div className="flex flex-wrap gap-3 pt-6 border-t border-gray-100 dark:border-gray-800">
                                                {selectedProject.link && <a href={selectedProject.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 bg-black dark:bg-white text-white dark:text-black rounded-full font-medium hover:opacity-80 transition-opacity text-sm">{(() => { const btn = getButtonText(selectedProject); return <>{btn.text}<i data-lucide={btn.icon} className="w-4 h-4"></i></>; })()}</a>}
                                                {selectedProject.github && <a href={selectedProject.github} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 border border-gray-200 dark:border-gray-700 rounded-full font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-sm"><i data-lucide="github" className="w-4 h-4"></i>Source Code</a>}
                                            </div>
                                        </div>
                                    </div>
                                </motion.div>
                            </div>
                        </motion.div>
                    )}
                </AnimatePresence>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
