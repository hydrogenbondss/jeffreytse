    <script>
      (() => {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";

        const resetScroll = () => {
          window.scrollTo(0, 0);
          document.body && (document.body.scrollTop = 0);
          document.documentElement && (document.documentElement.scrollTop = 0);
        };

        const scheduleReset = () => {
          resetScroll();
          requestAnimationFrame(resetScroll);
          setTimeout(resetScroll, 60);
        };

        ["pushState", "replaceState"].forEach((method) => {
          const original = history[method];
          history[method] = function patchedHistoryMethod(...args) {
            const result = original.apply(this, args);
            window.dispatchEvent(new Event("portfolio:navigation"));
            scheduleReset();
            return result;
          };
        });

        window.addEventListener("popstate", scheduleReset);
        window.addEventListener("hashchange", scheduleReset);
        window.addEventListener("load", scheduleReset);

        if (["/cathedral", "/garden", "/feature-world"].some((route) => window.location.pathname.endsWith(route))) {
          const base = window.location.pathname.startsWith("/jeffreytse/") ? "/jeffreytse/" : "/";
          history.replaceState(null, "", base);
          scheduleReset();
        }
      })();
    </script>
