<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Binary One</title>
<meta name="description" content="An infinite gothic cathedral built from falling green binary code. A continuous, endless descent through architecture made of light and number.">
<meta name="theme-color" content="#000000">
<style>
  :root{
    --bg:#000000;
    --green:#3bff7e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    color:var(--green);
    font-family:'Courier New',ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    touch-action:none;
  }
  #stage{
    position:fixed;inset:0;
    background:#000;
    cursor:crosshair;
  }
  canvas{
    display:block;
    width:100%;height:100%;
    position:absolute;inset:0;
  }
  /* the GL canvas is the depth field; the 2D canvas is the glyph rain overlay */
  #gl{z-index:1;}
  #rain{z-index:2;mix-blend-mode:screen;opacity:0.92;}
  /* vignette + scanline + bloom-ish veil drawn purely in CSS for cheap depth */
  #veil{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%),
      radial-gradient(60% 50% at 50% 38%, rgba(59,255,126,0.10) 0%, rgba(59,255,126,0) 60%);
    mix-blend-mode:normal;
  }
  #scan{
    position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0.10;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.6) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:multiply;
  }
  #grain{
    position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0.05;
    mix-blend-mode:overlay;
  }

  /* title / caption — quiet, editorial */
  #cap{
    position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));
    z-index:6;text-align:center;pointer-events:none;
    color:rgba(180,255,205,0.62);
    font-size:11px;letter-spacing:0.42em;text-transform:uppercase;
    text-shadow:0 0 14px rgba(59,255,126,0.5);
    opacity:0;animation:capIn 3.2s ease 0.6s forwards;
  }
  #cap b{font-weight:400;color:rgba(220,255,232,0.92);letter-spacing:0.5em;}
  #cap span{display:block;margin-top:7px;font-size:9px;letter-spacing:0.3em;color:rgba(150,230,180,0.4);}
  @keyframes capIn{to{opacity:1;}}

  /* tiny hint, fades out */
  #hint{
    position:fixed;left:0;right:0;top:max(20px,env(safe-area-inset-top));
    z-index:6;text-align:center;pointer-events:none;
    color:rgba(150,230,180,0.45);
    font-size:10px;letter-spacing:0.34em;text-transform:uppercase;
    text-shadow:0 0 10px rgba(59,255,126,0.4);
    opacity:0;animation:hintIn 2.6s ease 1.4s forwards, hintOut 2.2s ease 9s forwards;
  }
  @keyframes hintIn{to{opacity:1;}}
  @keyframes hintOut{to{opacity:0;}}

  #fallback-note{display:none;}
  @media (prefers-reduced-motion: reduce){
    #scan{display:none;}
  }
</style>
</head>
<body>
<div id="stage" aria-label="An infinite gothic cathedral made of falling green binary code">
  <canvas id="gl"></canvas>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div id="veil"></div>
  <div id="scan"></div>
  <canvas id="grain" aria-hidden="true"></canvas>
</div>

<div id="hint">drift &middot; move to steer</div>
<div id="cap"><b>BINARY ONE</b><span>an endless cathedral of code</span></div>

<script>
"use strict";
(function(){

  /* ============================================================
     BINARY ONE
     An infinite gothic cathedral made of falling green binary.

     Two coupled layers create genuine depth:
       (1) #gl  — a raw-WebGL fragment shader that ray-marches a
                  procedurally repeating ("modulo") gothic interior:
                  pointed arches, ribbed vaults, columns and a rose
                  window, all on an endless forward-zoom domain so the
                  geometry is RE-USED forever and never reaches a wall,
                  a floor, or an exit. The surfaces are textured with
                  scrolling binary so the architecture is literally
                  made of 1s and 0s and dissolves back into them.
       (2) #rain — a Canvas2D parallax field of falling binary columns
                  at several depths, screen-blended over the GL so the
                  near code drips in front of the far architecture.

     Reduced-motion: GL is skipped; a calm, slow 2D drift is shown.
     ============================================================ */

  var REDUCED = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DPRMAX = 2;
  function dpr(){ return Math.min(window.devicePixelRatio || 1, DPRMAX); }

  // ---- pointer / device steering (gentle, eased) -------------
  var steer = { x:0, y:0, tx:0, ty:0 };
  function onMove(px, py, w, h){
    steer.tx = (px / w - 0.5) * 2;   // -1 .. 1
    steer.ty = (py / h - 0.5) * 2;
  }
  window.addEventListener('pointermove', function(e){
    onMove(e.clientX, e.clientY, window.innerWidth, window.innerHeight);
  }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]){
      onMove(e.touches[0].clientX, e.touches[0].clientY,
             window.innerWidth, window.innerHeight);
    }
  }, {passive:true});
  // subtle parallax from device tilt on mobile
  window.addEventListener('deviceorientation', function(e){
    if(e.gamma==null || e.beta==null) return;
    steer.tx = Math.max(-1, Math.min(1, (e.gamma||0)/35));
    steer.ty = Math.max(-1, Math.min(1, ((e.beta||0)-45)/45));
  }, true);

  /* =========================================================
     LAYER 1 — WebGL infinite cathedral
     ========================================================= */

  var glCanvas = document.getElementById('gl');
  var gl = null;
  var glOK = false;

  var VERT = [
    'attribute vec2 p;',
    'void main(){ gl_Position = vec4(p,0.0,1.0); }'
  ].join('\n');

  // Fragment shader: a forward-flying raymarch through a repeated
  // gothic nave. Endlessness comes from mod() on the marching axis
  // plus a continuously advancing camera, so the loop seam is invisible.
  var FRAG = [
    'precision highp float;',
    'uniform vec2  uRes;',
    'uniform float uTime;',
    'uniform vec2  uSteer;',
    'uniform float uReduce;',

    // hash / value noise for the binary texture + grain
    'float hash(vec2 q){ return fract(sin(dot(q, vec2(41.3,289.1))) * 43758.5453); }',
    'float hash1(float n){ return fract(sin(n)*43758.5453); }',

    // a glyph mask that reads as a scrolling 1/0 column
    'float binaryTex(vec2 uv, float t){',
    '  vec2 g = vec2(14.0, 22.0);',          // glyph grid density
    '  vec2 cell = floor(uv*g);',
    // each column scrolls downward at its own speed -> falling code
    '  float colSpeed = 0.6 + 0.9*hash1(cell.x*1.3);',
    '  float scroll = floor(uv.y*g.y + t*colSpeed*6.0);',
    '  float on = step(0.5, hash(vec2(cell.x, scroll)));',     // is this cell lit
    '  float bit = step(0.5, hash(vec2(cell.x*3.1, scroll*1.7)));', // 1 vs 0 (visual weight)
    // brightness trails: head bright, tail dim -> matrix cascade
    '  float head = fract((uv.y)*g.y - t*colSpeed*6.0);',
    '  float trail = pow(1.0 - head, 3.0);',
    '  float ink = on * (0.25 + 0.75*trail) * (0.55 + 0.45*bit);',
    '  return ink;',
    '}',

    // pointed-arch / nave field. Returns a 0..1 "wall presence".
    // We build the cross-section of a gothic nave and extrude it down z.
    'float gothicCross(vec2 q){',
    // q.x across nave (-1..1-ish), q.y up the wall
    '  float ax = abs(q.x);',
    // two leaning lines meeting at an apex -> pointed arch
    '  float apex = 1.15;',
    '  float arch = ax + max(0.0, q.y);',          // diagonal toward apex
    '  float wall = smoothstep(0.02, 0.0, abs(arch - apex));',
    // vertical clustered colonnade ribs (repeat across x)
    '  float ribs = abs(fract(q.x*3.0)-0.5);',
    '  float rib  = smoothstep(0.06,0.0,ribs) * smoothstep(1.2,0.2,q.y);',
    // floor far below + ceiling boss line never actually reached
    '  float frame = smoothstep(0.04,0.0,abs(ax-1.0)) * smoothstep(1.1,-0.2,q.y);',
    '  return clamp(wall*1.0 + rib*0.7 + frame*0.6, 0.0, 1.0);',
    '}',

    'void main(){',
    '  vec2 uv = (gl_FragCoord.xy - 0.5*uRes.xy) / uRes.y;', // y-normalized
    // gentle steer: looking around the nave without ever leaving it
    '  vec2 look = uSteer * 0.16;',
    '  uv += look;',

    // forward speed; reduced-motion -> very slow drift
    '  float spd = mix(1.0, 0.18, uReduce);',
    '  float z = uTime * spd;',                 // camera position down the nave

    '  vec3 col = vec3(0.0);',

    // ---- layered depth planes of the cathedral -------------
    // Each plane is a repeated "bay" of the nave at increasing depth.
    // We march a handful of bays; mod(z) makes them recycle forever.
    '  const int BAYS = 16;',
    '  float baySpacing = 1.0;',
    '  for(int i=0;i<BAYS;i++){',
    '    float fi = float(i);',
    // depth of this bay in front of the camera, recycled with mod
    '    float d = mod(fi*baySpacing - z, float(BAYS)*baySpacing);',
    '    if(d < 0.001) d += float(BAYS)*baySpacing;',
    // perspective: nearer bays are larger; convert to a scale
    '    float persp = 1.0 / (d*0.55 + 0.6);',
    // sample the gothic cross-section in this bay's local space
    '    vec2 q = vec2(uv.x / persp * 1.5, (0.42 - uv.y) / persp * 1.7);',
    // a slow sway gives the columns a breathing, living feel
    '    q.x += sin(d*0.6 + uTime*0.25)*0.015;',
    '    float wall = gothicCross(q);',
    // the rose window: a bright circular tracery centered high up,
    // strongest in the deepest bay so it sits like an altar window
    '    float roseR = length(vec2(uv.x, (uv.y-0.16)*1.1)) ;',
    '    float roseDepth = smoothstep(float(BAYS)*baySpacing, float(BAYS)*0.6, d);',
    '    float petals = 0.5 + 0.5*cos(atan(uv.y-0.16, uv.x)*8.0 + uTime*0.2);',
    '    float rose = smoothstep(0.34,0.30,roseR) * smoothstep(0.05,0.12,roseR)',
    '                 * (0.4 + 0.6*petals) * roseDepth;',

    // bind binary texture onto the architectural surfaces
    '    vec2 tuv = vec2(q.x*0.5+0.5, q.y*0.5);',
    '    float code = binaryTex(tuv, uTime + fi*0.7);',

    // surface lit only where wall present; code makes the surface
    '    float surf = wall * (0.18 + 0.95*code);',
    '    surf += rose * (0.5 + 0.8*binaryTex(vec2(uv.x*0.5+0.5, uv.y*0.6+0.5), uTime*0.6));',

    // fog by depth: far bays glow dimmer & cooler -> deep blacks behind
    '    float fog = exp(-d*0.26);',
    '    float lit = surf * fog * persp * 0.9;',

    // electric-green palette with a touch of cyan in the highlights
    '    vec3 g = vec3(0.10, 1.0, 0.42);',
    '    vec3 hot = vec3(0.65, 1.0, 0.80);',
    '    vec3 c = mix(g, hot, clamp(lit*1.4,0.0,1.0));',
    '    col += c * lit;',
    '  }',

    // central vanishing glow — the infinite end of the nave that you
    // fall toward but never reach (it always recedes as z advances)
    '  float core = exp(-length(uv*vec2(1.0,1.3))*4.5);',
    '  col += vec3(0.10,0.9,0.45) * core * 0.9;',

    // cheap bloom: lift bright areas, soft saturate
    '  col = col / (1.0 + col*0.7);',          // tonemap
    '  col = pow(col, vec3(0.85));',            // gamma -> richer, saturated
    '  col *= vec3(0.86, 1.06, 0.92);',         // green-bias the whole frame

    // film grain so flat areas read as deep black film, not banding
    '  float grain = (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.045;',
    '  col += grain;',

    // vignette toward pure black at edges (depth + focus)
    '  float vig = smoothstep(1.15, 0.25, length(uv));',
    '  col *= mix(0.25, 1.0, vig);',

    '  gl_FragColor = vec4(max(col, 0.0), 1.0);',
    '}'
  ].join('\n');

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      // swallow — we'll fall back to 2D-only
      return null;
    }
    return s;
  }

  var prog=null, uRes, uTime, uSteer, uReduce, t0=performance.now();

  function initGL(){
    try{
      gl = glCanvas.getContext('webgl', {antialias:false, alpha:false,
            premultipliedAlpha:false, powerPreference:'high-performance'})
        || glCanvas.getContext('experimental-webgl');
    }catch(e){ gl=null; }
    if(!gl) return false;

    var vs = compile(gl.VERTEX_SHADER, VERT);
    var fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if(!vs || !fs) return false;

    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW); // big tri
    var loc = gl.getAttribLocation(prog,'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    uRes    = gl.getUniformLocation(prog,'uRes');
    uTime   = gl.getUniformLocation(prog,'uTime');
    uSteer  = gl.getUniformLocation(prog,'uSteer');
    uReduce = gl.getUniformLocation(prog,'uReduce');
    return true;
  }

  function sizeGL(){
    var d = dpr();
    // render the heavy shader a touch under native res for smoothness
    var scale = REDUCED ? 1.0 : 0.85;
    var w = Math.max(2, Math.floor(window.innerWidth  * d * scale));
    var h = Math.max(2, Math.floor(window.innerHeight * d * scale));
    glCanvas.width = w; glCanvas.height = h;
    if(gl) gl.viewport(0,0,w,h);
  }

  /* =========================================================
     LAYER 2 — Canvas2D parallax binary rain (foreground depth)
     ========================================================= */

  var rainCanvas = document.getElementById('rain');
  var rx = rainCanvas.getContext('2d');
  var rW=0, rH=0, columns=[];
  // three parallax depths: far (small, dim, slow), mid, near (big, bright, fast)
  var DEPTHS = REDUCED
    ? [{size:18,speed:14,alpha:0.30,density:0.55}]
    : [
        {size:11, speed:26, alpha:0.20, density:0.9},  // far
        {size:16, speed:46, alpha:0.34, density:0.7},  // mid
        {size:24, speed:78, alpha:0.50, density:0.45}  // near
      ];

  function makeColumn(depth, x){
    return {
      x:x,
      y: -Math.random()*rH,
      depth:depth,
      speed: depth.speed*(0.7+Math.random()*0.6),
      // a vertical string of bits with a bright leading head
      len: 6 + Math.floor(Math.random()*22),
      bits: [],
      headGlow: 0.6+Math.random()*0.4
    };
  }

  function buildColumns(){
    columns = [];
    var px = dpr();
    for(var di=0; di<DEPTHS.length; di++){
      var dpt = DEPTHS[di];
      var step = dpt.size*px*1.25;
      var n = Math.floor((rW/step) * dpt.density);
      for(var i=0;i<n;i++){
        var x = (i/n)*rW + (Math.random()-0.5)*step;
        columns.push(makeColumn(dpt, x));
      }
    }
  }

  function sizeRain(){
    var px = dpr();
    rW = rainCanvas.width  = Math.floor(window.innerWidth  * px);
    rH = rainCanvas.height = Math.floor(window.innerHeight * px);
    buildColumns();
  }

  function drawRain(dt){
    // fade previous frame slightly -> motion trails (the cascade tail)
    rx.globalCompositeOperation = 'source-over';
    rx.fillStyle = 'rgba(0,0,0,' + (REDUCED?0.16:0.28) + ')';
    rx.fillRect(0,0,rW,rH);
    rx.globalCompositeOperation = 'lighter';

    var px = dpr();
    // foreground rain drifts opposite the steer for parallax against GL
    var driftX = -steer.x * 26 * px;

    for(var c=0;c<columns.length;c++){
      var col = columns[c];
      var d = col.depth;
      // near layers parallax-shift more than far layers
      var par = (d.size/24);
      var x = col.x + driftX*par;
      col.y += col.speed * dt * px;

      var fs = d.size*px;
      rx.font = fs + 'px "Courier New", monospace';
      rx.textBaseline = 'top';

      // draw the falling string: head is hot white-green, tail dims
      for(var b=0;b<col.len;b++){
        var yy = col.y - b*fs;
        if(yy < -fs || yy > rH) continue;
        var glyph = (Math.random()<0.5)?'0':'1';
        var k = 1 - b/col.len;            // 1 at head, 0 at tail
        if(b===0){
          rx.fillStyle = 'rgba(225,255,235,' + (d.alpha*1.8*col.headGlow) + ')';
          rx.shadowColor = 'rgba(80,255,150,0.9)';
          rx.shadowBlur = fs*0.9;
        }else{
          var a = d.alpha * Math.pow(k,1.6);
          rx.fillStyle = 'rgba(60,255,130,' + a.toFixed(3) + ')';
          rx.shadowBlur = 0;
        }
        // glyphs occasionally hold; mostly flicker for the rain feel
        rx.fillText(glyph, x, yy);
      }
      rx.shadowBlur = 0;

      // recycle endlessly when fully past the bottom
      if(col.y - col.len*fs > rH){
        col.y = -Math.random()*fs*8;
        col.x = Math.random()*rW;
        col.len = 6 + Math.floor(Math.random()*22);
        col.speed = d.speed*(0.7+Math.random()*0.6);
        col.headGlow = 0.6+Math.random()*0.4;
      }
    }
  }

  /* =========================================================
     Static grain canvas (cheap film texture)
     ========================================================= */
  var grainCanvas = document.getElementById('grain');
  function paintGrain(){
    var gx = grainCanvas.getContext('2d');
    var s = 160;
    grainCanvas.width = s; grainCanvas.height = s;
    grainCanvas.style.width='100%'; grainCanvas.style.height='100%';
    var img = gx.createImageData(s,s);
    for(var i=0;i<img.data.length;i+=4){
      var v = (Math.random()*255)|0;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
    }
    gx.putImageData(img,0,0);
  }

  /* =========================================================
     Main loop
     ========================================================= */
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last)/1000);
    last = now;

    // ease the steer toward target -> nothing jerks
    steer.x += (steer.tx - steer.x) * Math.min(1, dt* (REDUCED?0.6:2.4));
    steer.y += (steer.ty - steer.y) * Math.min(1, dt* (REDUCED?0.6:2.4));

    if(glOK){
      var t = (now - t0)/1000;
      gl.uniform2f(uRes, glCanvas.width, glCanvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform2f(uSteer, steer.x, steer.y);
      gl.uniform1f(uReduce, REDUCED?1.0:0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    drawRain(dt);
    requestAnimationFrame(frame);
  }

  /* =========================================================
     Boot
     ========================================================= */
  function resize(){ sizeGL(); sizeRain(); }

  function boot(){
    paintGrain();
    if(!REDUCED){
      glOK = initGL();
    }
    if(!glOK){
      // GL unavailable (or reduced motion) -> 2D-only.
      // Give the rain a soft green floor so it doesn't read as bare.
      document.getElementById('gl').style.background =
        'radial-gradient(120% 90% at 50% 40%, #021a0c 0%, #000 70%)';
    }
    resize();
    requestAnimationFrame(frame);
  }

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(resize, 150);
  });
  // pause work when tab hidden (battery + smoothness on return)
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ last = performance.now(); }
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  }else{ boot(); }

})();
</script>
</body>
</html>
