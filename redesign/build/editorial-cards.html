<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Editorial — Jeffrey N. Tse</title>
<meta name="description" content="Fashion editorial displayed as a wall of cassette tapes — each editorial a cassette, generated from its cover. Pull one off the shelf to read it.">
<meta name="theme-color" content="#e7ddcc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a10;--ink-soft:#5c4f3c;--ink-faint:#8c7c64;--hot:#b23a26;
    --serif:'Cormorant Garamond',Georgia,serif;--mono:'Courier Prime',monospace;--ui:'Inter',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.3,.5,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;background:#140e08}
  /* generated cassette-shop wall, soft + out of focus, as the backdrop */
  .shopwall{position:fixed;inset:-6%;z-index:-2;
    background:#140e08 url('https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_083623_caaf1cc8-d1ab-46a0-a832-59ddf8dd581b.png') center/cover no-repeat;
    filter:blur(12px) brightness(.52) saturate(1.08);transform:scale(1.05)}
  .shopscrim{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 34%, transparent 40%, rgba(15,9,5,.72)),
      linear-gradient(180deg, rgba(15,9,5,.55) 0%, rgba(15,9,5,.10) 26%, rgba(15,9,5,.20) 58%, rgba(15,9,5,.68) 100%)}

  #editorial{min-height:100vh;display:flex;flex-direction:column;padding:clamp(22px,4vw,46px)}
  .ed-head{text-align:center;margin-bottom:clamp(16px,3vw,30px)}
  .ed-kicker{font-family:var(--mono);font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,243,228,.82);margin-bottom:7px;text-shadow:0 1px 16px rgba(0,0,0,.7)}
  .ed-title{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(2.8rem,7vw,5rem);line-height:.9;color:#fff6ea;text-shadow:0 3px 40px rgba(0,0,0,.8)}

  .wall{max-width:1180px;width:100%;margin:0 auto;flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
    gap:clamp(18px,2.2vw,34px) clamp(12px,1.6vw,24px)}
  .tape{width:clamp(132px,16.5vw,184px)}

  .tape{appearance:none;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;
    display:flex;flex-direction:column;align-items:center;gap:9px}
  .cass{position:relative;width:100%;aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:#1a140d center/cover no-repeat;
    box-shadow:0 16px 26px -14px rgba(40,28,14,.65);transition:transform .45s var(--spring), box-shadow .45s var(--spring)}
  .read{position:absolute;top:9px;right:9px;z-index:3;font-family:var(--mono);font-size:.46rem;letter-spacing:.18em;text-transform:uppercase;
    color:#1a140d;background:#f4efe6;padding:3px 8px;border-radius:20px;opacity:0;transform:translateY(-4px);transition:.3s var(--spring)}
  .tape:hover .cass,.tape:focus-visible .cass{transform:translateY(-14px) rotate(-.6deg);box-shadow:0 34px 40px -16px rgba(40,28,14,.6)}
  .tape:hover .read,.tape:focus-visible .read{opacity:1;transform:none}
  .tape:focus-visible{outline:none}

  .label{width:96%;background:#fffdf8;border:1px solid rgba(40,28,14,.16);border-radius:2px;padding:5px 8px;
    box-shadow:0 3px 8px -3px rgba(40,28,14,.35);text-align:left;transform:rotate(-.4deg)}
  .label .lt{font-family:var(--mono);font-size:.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);
    line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .label .lb{display:flex;justify-content:space-between;gap:6px;margin-top:3px;font-family:var(--mono);font-size:.44rem;
    letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
  .label .lb .flag{color:var(--hot);font-weight:700}

  .ed-foot{text-align:center;margin-top:clamp(18px,3vw,30px);font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:rgba(255,243,228,.55)}

  @media(max-width:760px){.tape{width:calc(33.33% - 18px)}}
  @media(max-width:460px){.tape{width:calc(50% - 12px)}}
  @media(prefers-reduced-motion:reduce){.cass{transition:none}}
</style>
</head>
<body>
<div class="shopwall" aria-hidden="true"></div>
<div class="shopscrim" aria-hidden="true"></div>
<section id="editorial" aria-label="Editorial — a wall of cassette tapes">
  <header class="ed-head">
    <div class="ed-kicker">Fashion</div>
    <h1 class="ed-title">Editorial</h1>
  </header>
  <div class="wall" id="wall"></div>
  <div class="ed-foot">Pull a tape off the shelf to read the editorial.</div>
</section>

<script>
(function(){
  "use strict";
  var IMG="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/";
  var CASS=[
    {n:"NO ZIPPERS, NO APOLOGIES",s:"Renaissance Renaissance",t:"FW25",l:"https://hk.iteshop.com/bit/editorial/renaissance-renaissance-no-zippers-no-apologies",img:"hf_20260630_080041_59fe8b29-f18f-4ab5-a29d-1b02dc95cb84.png"},
    {n:"MARKGONG FALL 2025",s:"Rebellion & Nostalgia",t:"FW25",l:"https://hk.iteshop.com/bit/editorial/markgong-fall-winter-2025",img:"hf_20260630_080044_07426637-9d2a-4f42-afb6-ea27c7ff674f.png"},
    {n:"MASAYUKI INO",s:"Doublet — Interview",t:"DBLT",l:"https://hk.iteshop.com/bit/editorial/doublet-masayuki-ino-interview",img:"hf_20260630_080715_78094f98-145b-42a0-8254-35c8e1525a18.png"},
    {n:"A BATHING APE®",s:"FW24 — Shanghai",t:"FW24",l:"https://hk.iteshop.com/bit/editorial/bape-fw24-runway-show",img:"hf_20260630_080924_2b423f5d-fb84-4214-ae9c-de5ad362e6df.png"},
    {n:"THE RISE OF BLOKECORE",s:"Football Fashion",t:"SPORT",l:"https://hk.iteshop.com/bit/editorial/rise-of-blokecore-jersey-fashion",img:"hf_20260630_080926_ec3612c6-98de-4a21-80c2-40d1fe91ad64.png"},
    {n:"THE GOTHIC REALM",s:"Obsidian Elegance",t:"SS24",l:"https://hk.iteshop.com/bit/editorial/gothic-dark-fashion-ss24",img:"hf_20260630_080724_988023bb-c6f2-4381-8676-a301e85f04f4.png"},
    {n:"PONDER.ER SS24",s:"Road Trip to Heaven",t:"SS24",l:"https://hk.iteshop.com/bit/editorial/ponder-er-women-ss24",img:"hf_20260630_080727_8c1281af-4e40-4e6f-a23c-edb5d07bb129.png"},
    {n:"WESTFALL",s:"California Punk",t:"SS24",l:"https://hk.iteshop.com/bit/editorial/westfall-ss24-new-arrival",img:"hf_20260630_080730_d713ed3c-0e87-465a-9d12-1d14aae0939b.png"},

    {n:"SUBI · SUBEZ YETI",s:"Carhartt WIP — Interview",t:"CWIP",l:"https://hk.iteshop.com/sit/editorial/carhartt-wip-subi-subez-yeti-interview",img:"hf_20260630_080736_670e794f-a8fa-4a58-b8df-1cc4b40a8bf9.png"},
    {n:"HONG KONG SHOWROOM",s:"Designers to Watch",t:"FA24",l:"https://hk.iteshop.com/bit/editorial/fashion-asia-showroom-2024",img:"hf_20260630_082312_96aa9c93-c893-48c1-8ffc-3f767887ac2b.png"},
    {n:"RICK OWENS SS24",s:"Grim Elegance",t:"SS24",l:"https://hk.iteshop.com/bit/editorial/rick-owens-ss24-new-collection",img:"hf_20260630_082314_6fec6d65-e862-486b-af4b-0beb5c6af184.png"},
    {n:"SWEET REBELLION",s:"SHUSHU/TONG — Liushu Lei",t:"INT",l:"https://hk.iteshop.com/bit/editorial/shushu-tong-interview-and-collection",img:"hf_20260630_082316_76d544b7-8073-4b11-ba86-ec793fa92812.png"},
    {n:"THE MEANING OF LOVE",s:"Love is…",t:"LOVE",l:"https://hk.iteshop.com/bit/editorial/discover-the-meaning-of-love",img:"hf_20260630_082319_eb16a17a-f0e8-46df-bdba-3c93ccbddde5.png"},
    {n:"BREAKING BOUNDARIES",s:"Skate Fashion to Watch",t:"SK8",l:"https://hk.iteshop.com/sit/editorial/breaking-boundaries",img:"hf_20260630_082323_9cb7f514-c3f4-49f5-8336-3b1f3144137f.png"},
    {n:"IN THE STUDIO WITH TAKU",s:"Carhartt WIP — Beyond the Brush",t:"CWIP",l:"https://hk.iteshop.com/sit/editorial/taku-carhartt-wip-beyond-the-brush",img:"hf_20260630_082325_9246e488-9d0c-49b7-946a-dcb9bc94386e.png"},
    {n:"JERSEY TEES",s:"From Pitch to Streets",t:"SPORT",l:"https://hk.iteshop.com/sit/editorial/jersey-tees-from-pitch-to-streets",img:"hf_20260630_082506_178cb109-14a6-4e74-a4c6-5ff2e33294e9.png"}
  ];
  var GENRES=[
    "Renaissance / Markgong / Doublet / A Bathing Ape® / Blokecore",
    "Gothic / Ponder.er / Westfall / Mountwood / Carhartt WIP"
  ];
  var wall=document.getElementById("wall");
  function tape(e){
    return '<button class="tape" type="button" onclick="window.open(\''+e.l+'\',\'_blank\',\'noopener\')" aria-label="'+e.n+' — read editorial">'+
      '<span class="cass" style="background-image:url(\''+IMG+e.img+'\')"><span class="read">Read</span></span>'+
      '<span class="label"><span class="lt">'+e.n+'</span>'+
        '<span class="lb"><span class="flag">HK</span><span>'+e.s+'</span><span>'+e.t+'</span></span></span>'+
    '</button>';
  }
  wall.innerHTML = CASS.map(tape).join("");
})();
</script>
</body>
</html>
