<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Editorial — Jeffrey N. Tse</title>
<meta name="description" content="Fashion editorial as a wall of cassette tapes — a Higgsfield-composed record-shop shelf of the I.T Apparels editorials.">
<meta name="theme-color" content="#e7ddca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a10;--ink-soft:#5c5040;--ink-faint:#8f8268;
    --serif:'Cormorant Garamond',Georgia,serif;--mono:'Courier Prime',monospace;--ui:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(100% 60% at 50% -10%, #fffdf8, rgba(255,253,248,0) 60%),linear-gradient(180deg,#efe7d8,#e2d6c1)}

  #editorial{min-height:100vh;display:flex;flex-direction:column;padding:clamp(18px,3vw,40px)}
  .ed-head{text-align:center;margin-bottom:clamp(12px,2.2vw,26px)}
  .ed-kicker{font-family:var(--mono);font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .ed-title{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(2.6rem,6.4vw,4.6rem);line-height:.9;color:var(--ink)}

  /* the two Higgsfield-composed shelves, stacked into one wall */
  .wall{max-width:920px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .wall .stack{width:100%;border-radius:8px;overflow:hidden;box-shadow:0 50px 110px -42px rgba(40,28,14,.6)}
  .wall .stack img{display:block;width:100%;height:auto}
  .wall .stack img + img{margin-top:-1px}

  .ed-foot{text-align:center;margin-top:clamp(12px,2vw,24px);font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:var(--ink-faint)}
</style>
</head>
<body>
<section id="editorial" aria-label="Editorial — a wall of cassette tapes">
  <header class="ed-head">
    <div class="ed-kicker">Fashion &middot; I.T Apparels</div>
    <h1 class="ed-title">Editorial</h1>
  </header>
  <div class="wall">
    <div class="stack">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_091534_7a7c2645-c516-419a-bd28-127dd33a1d54.png" alt="Editorial cassettes — shelf one">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_091539_a5066a18-c943-4eda-87a6-2f68fb520f0e.png" alt="Editorial cassettes — shelf two">
    </div>
  </div>
  <div class="ed-foot">17 I.T Apparels editorials &mdash; New York / Hong Kong</div>
</section>
</body>
</html>
