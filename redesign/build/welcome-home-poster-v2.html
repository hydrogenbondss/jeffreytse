<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome Home — v2 (fixed riso art + dark type)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     WELCOME HOME v2 — the corrected method.
     Generated riso art (locked acid-green / crimson / black,
     no rainbow glitch) + real TYPE in BLACK & CRIMSON sitting
     on the flat green zones. No scrims — the ground is light,
     so dark ink reads clean and prints WITH the art.
     ============================================================ */
  :root{
    --anton:'Anton',Impact,sans-serif; --mono:'Space Mono',monospace; --mark:'Reenie Beanie',cursive;
    --ink:#16140d; --crimson:#d8265a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#17171a;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,4vw,52px);font-family:var(--anton)}

  .poster{position:relative;width:min(540px,92vw);aspect-ratio:848/1264;overflow:hidden;color:var(--ink);
    background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_170455_11804830-04b8-4c57-bf7b-ad2f7805c7d7.png");
    background-size:cover;background-position:center;
    box-shadow:0 30px 70px -24px rgba(0,0,0,.7)}

  /* --- handwriting, top --- */
  .hand{position:absolute;top:16px;right:15px;z-index:3;font-family:var(--mark);
    font-size:clamp(1.3rem,5vw,1.9rem);line-height:.95;width:52%;text-align:right;color:var(--crimson);
    transform:rotate(-2deg)}

  /* --- bottom flat-green zone --- */
  .title{position:absolute;left:15px;bottom:46px;z-index:3;font-family:var(--anton);
    font-size:clamp(2.8rem,12vw,4.4rem);line-height:.8;text-transform:uppercase;letter-spacing:-.01em;color:var(--ink)}
  .title span{color:var(--crimson)}
  .credit{position:absolute;left:16px;bottom:22px;z-index:3;font-family:var(--mono);font-size:.56rem;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}

  .cap{font-family:var(--mono);font-size:.62rem;color:#9a9a8a;text-align:center;margin-top:16px;letter-spacing:.04em;max-width:54ch;line-height:1.5}
</style>
</head>
<body>
  <article class="poster">
    <div class="hand">what makes a room yours?</div>

    <h1 class="title">Welcome<br><span>Home</span></h1>
    <div class="credit">Cube in Cube — Olivia Qiu, 2017</div>
  </article>
  <p class="cap">WELCOME HOME v2 · fixed riso art (variant 1) + black/crimson type on the flat green zones. Type placement is a first pass on this art — say the word and I nudge.</p>
</body>
</html>
