<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lab — Walk the City</title>
<meta name="description" content="The Lab as a walkable night city: each project embedded in the street, with a game HUD.">
<meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     LAB — WALKABLE CITY + HUD  (2.5D pan-walk, no 3D engine)
     Image sources live in the CONFIG block in the script below.
     STREET_SRC is the only one still pending (the wide panorama);
     it falls back to a gradient until the approved URL is pasted in.
     ============================================================ */
  :root{
    --bg:#05060a; --ink:#f4f1e9; --ink-soft:#9aa3b2;
    --turbo:#7fd4ff; --pabepabe:#ffb7c8; --lovebug:#ff5d7a;
    --ash:#ff4d4d; --binary:#3bff7e; --fallow:#86d98f;
    --mono:'Courier Prime',monospace; --serif:'Cormorant Garamond',Georgia,serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
  #lab{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab}
  #lab.grabbing{cursor:grabbing}

  /* ---------- SCENES ---------- */
  .scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility .6s var(--ease)}
  .scene.on{opacity:1;visibility:visible}

  /* ---------- STREET (walkable wide panorama) ---------- */
  #world{position:absolute;top:0;left:0;height:100%;will-change:transform;
    background:linear-gradient(180deg,#0a1430 0%, #141b2e 42%, #0b0d14 100%);
    background-size:cover;background-position:center;}
  #world.has-img{background-repeat:no-repeat}
  /* subtle atmosphere so the gradient fallback still reads as a street */
  #world::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.0) 40%, rgba(0,0,0,.55) 100%)}
  /* real films playing embedded on the billboard / in the shop window */
  .embed{position:absolute;overflow:hidden;border-radius:3px;z-index:3;box-shadow:0 0 36px rgba(0,0,0,.45)}
  .embed video{width:100%;height:100%;object-fit:cover;display:block}
  .embed.billboard{box-shadow:0 10px 50px rgba(127,212,255,.28);outline:2px solid rgba(255,255,255,.14);outline-offset:-2px}
  .embed.window{box-shadow:0 10px 36px rgba(255,183,200,.24);outline:2px solid rgba(255,255,255,.10);outline-offset:-2px}
  /* subtle living atmosphere (kept faint so it never reads as cheap CSS) */
  .amb{position:absolute;inset:0;pointer-events:none;z-index:2}
  .amb.fog{background:radial-gradient(55% 45% at 28% 82%,rgba(120,150,255,.05),transparent 70%),radial-gradient(48% 42% at 82% 72%,rgba(255,120,180,.045),transparent 70%);animation:fogdrift 20s ease-in-out infinite alternate}
  @keyframes fogdrift{0%{transform:translateX(-1.5%)}100%{transform:translateX(1.5%)}}
  @media(prefers-reduced-motion:reduce){.amb.fog{animation:none}}

  /* hotspots embedded in the street */
  .spot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;z-index:4}
  .spot .ring{display:block;width:clamp(54px,6vw,86px);height:clamp(54px,6vw,86px);border-radius:50%;
    border:1.5px solid color-mix(in srgb,var(--acc) 80%,transparent);
    box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 12%,transparent),0 0 34px color-mix(in srgb,var(--acc) 45%,transparent);
    position:relative;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
  .spot .ring::before{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--acc);opacity:.9}
  .spot .tag{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;
    font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);
    background:rgba(5,6,10,.72);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);padding:5px 10px;border-radius:3px;
    opacity:0;transition:opacity .3s var(--ease)}
  .spot:hover .ring,.spot.active .ring{transform:scale(1.12);box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 18%,transparent),0 0 50px color-mix(in srgb,var(--acc) 70%,transparent)}
  .spot:hover .tag,.spot.active .tag{opacity:1}
  .spot:focus-visible .ring{outline:2px solid #fff;outline-offset:6px}

  /* ---------- STRUCTURE SCENES (own spot) ---------- */
  .structure{position:absolute;inset:0;background:#05060a center/cover no-repeat;cursor:pointer}
  .structure .enterwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14vh;text-align:center;
    background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%)}
  .structure .nm{font-weight:300;font-size:clamp(2.4rem,6vw,5rem);line-height:1;letter-spacing:.01em;text-shadow:0 4px 40px rgba(0,0,0,.6)}
  .structure .nm em{font-style:italic;color:var(--acc)}
  .structure .sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:14px}
  .structure .go{margin-top:22px;font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
    color:#05060a;background:var(--acc);padding:12px 22px;border-radius:4px;border:0;cursor:pointer;transition:.25s var(--ease)}
  .structure .go:hover{filter:brightness(1.12)}
  .backbtn{position:fixed;top:18px;left:18px;z-index:30;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink);background:rgba(5,6,10,.6);border:1px solid rgba(255,255,255,.18);padding:9px 14px;border-radius:4px;cursor:pointer}
  .backbtn:hover{border-color:rgba(255,255,255,.5)}

  /* ============ HUD ============ */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;font-family:var(--mono)}
  #hud.hidden{opacity:0}
  /* cinematic frame */
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.7);background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
  /* reticle */
  .reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.5}
  .reticle::before,.reticle::after{content:"";position:absolute;background:#fff;opacity:.8}
  .reticle::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
  .reticle::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
  /* location readout */
  #loc{position:absolute;left:50%;top:clamp(60px,8vh,100px);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .3s var(--ease)}
  #loc.show{opacity:1}
  #loc .cat{font-size:.5rem;letter-spacing:.34em;text-transform:uppercase;color:var(--acc,#fff)}
  #loc .nm{font-family:var(--serif);font-weight:300;font-size:1.2rem;line-height:1.1;margin-top:2px}
  /* enter / open prompt */
  #prompt{position:absolute;left:50%;bottom:clamp(60px,9vh,104px);top:auto;transform:translateX(-50%);
    font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
    background:rgba(5,6,10,.6);border:1px solid rgba(255,255,255,.22);padding:8px 14px;border-radius:4px;
    opacity:0;transition:opacity .25s var(--ease)}
  #prompt.show{opacity:1}
  /* edge walk arrows */
  .edge{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;
    display:grid;place-items:center;color:#fff;background:rgba(5,6,10,.5);border:1px solid rgba(255,255,255,.2);
    pointer-events:auto;cursor:pointer;opacity:.0;transition:opacity .3s var(--ease)}
  #lab:hover .edge{opacity:.85}
  .edge:hover{background:rgba(5,6,10,.8)}
  .edge.l{left:18px}.edge.r{right:18px}
  .edge svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.6}
  .edge[disabled]{opacity:.15!important;cursor:default}
  /* corner hints to the two structures */
  .hint{position:absolute;bottom:120px;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:8px;
    font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    background:rgba(5,6,10,.5);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);padding:9px 13px;border-radius:4px;opacity:.9}
  .hint:hover{background:rgba(5,6,10,.85)}
  .hint.l{left:18px}.hint.r{right:18px}
  .hint .dir{color:var(--acc)}
  /* minimap */
  #map{position:absolute;right:18px;bottom:18px;width:clamp(120px,15vw,184px);aspect-ratio:1/1;
    border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.22);background:#0a0e16 center/cover no-repeat;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #map .you{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25);transform:translate(-50%,-50%)}
  #map .mk{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);background:var(--acc)}
  #map .lbl{position:absolute;left:8px;top:7px;font-size:.5rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  /* title + hint, only on first load */
  .intro{position:absolute;left:18px;top:16px}
  .intro .t{font-family:var(--serif);font-style:italic;font-size:2rem;line-height:1}
  .intro .h{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}

  /* cinematic intro: the living city video, then it fades to the walkable street */
  #cityIntro{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .9s var(--ease)}
  #cityIntro.gone{opacity:0;visibility:hidden;pointer-events:none}
  #cityIntro video{width:100%;height:100%;object-fit:cover}
  #cityIntro .ttl{position:absolute;left:6vw;bottom:13vh;pointer-events:none;text-shadow:0 4px 40px rgba(0,0,0,.7)}
  #cityIntro .ttl b{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(2.6rem,8vw,6rem);display:block;line-height:1}
  #cityIntro .ttl span{font-family:var(--mono);font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft)}
  #cityIntro .skip{position:absolute;bottom:26px;right:26px;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.32);padding:11px 18px;border-radius:4px;cursor:pointer;pointer-events:auto}
  #cityIntro .skip:hover{background:rgba(0,0,0,.7)}
  /* click-to-open lightbox */
  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
  #lightbox[hidden]{display:none}
  #lightbox .lb-inner{max-width:92vw;max-height:86vh;display:flex}
  #lightbox video,#lightbox img{max-width:92vw;max-height:86vh;border-radius:6px;box-shadow:0 24px 90px rgba(0,0,0,.7)}
  #lightbox .lb-close{position:absolute;top:18px;right:24px;font-size:2rem;line-height:1;color:#fff;background:transparent;border:0;cursor:pointer;opacity:.8}
  #lightbox .lb-close:hover{opacity:1}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:680px){#map{width:108px}.intro .t{font-size:1.5rem}.hint{bottom:96px}}
</style>
</head>
<body>
<div id="lab" tabindex="0" aria-label="Lab — walk the city. Drag or use arrow keys to move.">

  <!-- ===== CINEMATIC INTRO (living city) ===== -->
  <div id="cityIntro">
    <video id="introVid" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="ttl"><b>Lab</b><span>Enter the city</span></div>
    <button class="skip" id="introSkip" type="button">Enter the street &#8594;</button>
  </div>

  <!-- ===== STREET SCENE ===== -->
  <section class="scene on" id="sc-street" aria-label="City street">
    <div id="world">
      <!-- hotspots injected by JS -->
    </div>
  </section>

  <!-- ===== STRUCTURE SCENES ===== -->
  <section class="scene" id="sc-binary" aria-label="Binary One">
    <div class="structure" data-enter="assets/lab/binary-one.html" style="--acc:var(--binary)">
      <div class="enterwrap">
        <div class="nm">Binary <em>One</em></div>
        <div class="sub">Entrance &middot; Interactive / WebGL</div>
        <button class="go" type="button">Click the structure to enter &#8594;</button>
      </div>
    </div>
  </section>

  <section class="scene" id="sc-fallow" aria-label="Fallow Ruins">
    <div class="structure" data-enter="assets/lab/fallow-ruins.html" style="--acc:var(--fallow)">
      <div class="enterwrap">
        <div class="nm">Fallow <em>Ruins</em></div>
        <div class="sub">Entrance &middot; Interactive / WebGL</div>
        <button class="go" type="button">Click the structure to enter &#8594;</button>
      </div>
    </div>
  </section>

  <button class="backbtn" id="back" hidden>&#8592; back to the street</button>

  <!-- ===== HUD ===== -->
  <div id="hud" aria-hidden="true">
    <div class="vig"></div>
    <div class="intro"><div class="t">Lab</div><div class="h">Walk the city &middot; drag or &#8592; &#8594;</div></div>
    <div class="reticle"></div>

    <button class="edge l" id="edgeL" aria-label="Walk left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="edge r" id="edgeR" aria-label="Walk right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

    <button class="hint l" id="hintBinary" style="--acc:var(--binary)"><span class="dir">&#8592;</span> Binary One</button>
    <button class="hint r" id="hintFallow" style="--acc:var(--fallow)">Fallow Ruins <span class="dir">&#8594;</span></button>

    <div id="map"><span class="lbl">Lab</span></div>
  </div>

  <!-- click-to-open lightbox -->
  <div id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Close">&times;</button>
    <div class="lb-inner"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ CONFIG — swap image URLs here ============ */
  var CFG = {
    // Wide 21:9 street panorama (Turbo billboard + PabePabe window + neon heart + Ash + fireworks).
    STREET_SRC: "https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_110947_a8a4ed39-d228-4b07-82a2-779adc448553.png",
    // Living version (cars + fireworks + Ash looming) — 16:9, used as the cinematic intro only.
    STREET_VIDEO: "https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_113215_431eb850-9ff7-4f68-a1a4-9ea7a06b70e6.mp4",
    BINARY_SRC: "https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_105740_c5341a56-6a39-4c51-abd7-0ab282bf9670.png",
    // placeholders until you approve them:
    FALLOW_SRC: "https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_104753_2e216d5d-6d98-4515-984f-477a65c17ea9.png",
    MAP_SRC:    "https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_104754_26e10317-2c7e-44b7-ab3c-2bfa9defbccf.png",
    WORLD_ASPECT: 21/9,   // panorama aspect, used to size the walkable width
    // Turbo + PabePabe are already baked INTO the panorama, so no floating video overlays.
    // (Motion/life comes from animating the whole street as a video — Layer 2.)
    EMBEDS: []
  };

  /* ============ PIECES on the street (xPct = position across the panorama) ============ */
  /* yPct/xPct are TUNABLE once the real street is in — set to match where each element landed. */
  var PIECES = [
    {key:"turbo",   x:12, y:28, acc:"var(--turbo)",   cat:"Billboard",       name:"Turbo MG21", media:"assets/lab/turbo_mg21.mp4"},
    {key:"ash",     x:37, y:20, acc:"var(--ash)",     cat:"The Figure",      name:"Ash-01",     media:"assets/lab/ash01.mp4"},
    {key:"lovebug", x:62, y:45, acc:"var(--lovebug)", cat:"Neon Heart",      name:"Love Bug",   open:"assets/lab/love-bug.html"},
    {key:"pabepabe",x:89, y:57, acc:"var(--pabepabe)",cat:"Boutique Window", name:"PabePabe",   open:"https://pabepabeofficial.com/"}
  ];

  var lab   = document.getElementById("lab");
  var world = document.getElementById("world");
  var hud   = document.getElementById("hud");
  var edgeL = document.getElementById("edgeL");
  var edgeR = document.getElementById("edgeR");
  var mapEl = document.getElementById("map");

  /* ---- apply image sources ---- */
  if(CFG.STREET_SRC){ world.style.backgroundImage="url('"+CFG.STREET_SRC+"')"; world.classList.add("has-img"); }
  document.querySelector("#sc-binary .structure").style.backgroundImage="url('"+CFG.BINARY_SRC+"')";
  document.querySelector("#sc-fallow .structure").style.backgroundImage="url('"+CFG.FALLOW_SRC+"')";
  if(CFG.MAP_SRC) mapEl.style.backgroundImage="url('"+CFG.MAP_SRC+"')";

  /* ---- LAYER 1: real films playing embedded in the street + subtle atmosphere ---- */
  (CFG.EMBEDS||[]).forEach(function(e){
    var d=document.createElement("div");
    d.className="embed "+e.kind;
    d.style.left=e.x+"%"; d.style.top=e.y+"%"; d.style.width=e.w+"%"; d.style.height=e.h+"%";
    var v=document.createElement("video");
    v.src=e.src; v.muted=true; v.loop=true; v.autoplay=true; v.preload="auto";
    v.setAttribute("playsinline",""); v.setAttribute("muted","");
    d.appendChild(v); world.appendChild(d);
    if(v.play){ var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); }
  });
  var fog=document.createElement("div"); fog.className="amb fog"; world.appendChild(fog);

  /* ---- size the walkable world (wider than viewport) ---- */
  var worldW=0, minX=0, x=0;
  function sizeWorld(){
    var h=window.innerHeight;
    worldW=Math.max(window.innerWidth*1.05, h*CFG.WORLD_ASPECT);
    world.style.width=worldW+"px";
    minX=Math.min(0, window.innerWidth-worldW);
    x=clamp(x); apply();
  }
  function clamp(v){ return Math.max(minX, Math.min(0, v)); }

  /* ---- build hotspots ---- */
  PIECES.forEach(function(p){
    var b=document.createElement("button");
    b.className="spot"; b.type="button"; b.dataset.key=p.key;
    b.style.left=p.x+"%"; b.style.top=p.y+"%"; b.style.setProperty("--acc",p.acc);
    b.setAttribute("aria-label",p.name+" — "+p.cat);
    b.innerHTML='<span class="ring"></span><span class="tag">'+p.name+'</span>';
    b.addEventListener("click",function(e){ e.stopPropagation(); openPiece(p); });
    world.appendChild(b);
    p.el=b;
    // minimap marker
    var mk=document.createElement("span"); mk.className="mk"; mk.style.background=p.acc;
    mk.style.left=p.x+"%"; mk.style.top=(20+p.x*0.55)+"%"; mapEl.appendChild(mk);
  });
  var you=document.createElement("span"); you.className="you"; mapEl.appendChild(you);

  function openPiece(p){
    if(p.media){ openLightbox(p); }
    else if(p.open){ window.open(p.open,"_blank","noopener"); }
  }

  /* ---- lightbox: clicking a piece opens its media right here ---- */
  var lb=document.getElementById("lightbox"), lbInner=lb.querySelector(".lb-inner");
  function openLightbox(p){
    lbInner.innerHTML="";
    var v=document.createElement("video");
    v.src=p.media; v.controls=true; v.autoplay=true; v.loop=true; v.setAttribute("playsinline","");
    lbInner.appendChild(v); lb.hidden=false;
  }
  function closeLightbox(){ lb.hidden=true; lbInner.innerHTML=""; }
  lb.addEventListener("click",function(e){ if(e.target===lb || e.target.classList.contains("lb-close")) closeLightbox(); });

  /* ---- transform + subtle nearest-piece highlight (no centre screen) ---- */
  function apply(){
    world.style.transform="translateX("+x+"px)";
    var cx=window.innerWidth/2, best=null, bestD=1e9;
    PIECES.forEach(function(p){
      var sx=x+(p.x/100)*worldW, d=Math.abs(sx-cx);
      p.el.classList.remove("active");
      if(d<bestD){bestD=d;best=p;}
    });
    if(best && bestD<window.innerWidth*0.16){ best.el.classList.add("active"); }
    var prog=worldW>window.innerWidth ? (-x)/(worldW-window.innerWidth) : 0;
    you.style.left=(8+prog*84)+"%"; you.style.top=(20+(8+prog*84)*0.55)+"%";
    edgeL.disabled = x>=0; edgeR.disabled = x<=minX;
  }

  /* ---- WALK controls: drag, wheel, keys, edge buttons ---- */
  var dragging=false, lastX=0, moved=0;
  lab.addEventListener("pointerdown",function(e){ if(curScene!=="street")return; dragging=true; moved=0; lastX=e.clientX; lab.classList.add("grabbing"); lab.setPointerCapture(e.pointerId); });
  lab.addEventListener("pointermove",function(e){ if(!dragging)return; var dx=e.clientX-lastX; lastX=e.clientX; moved+=Math.abs(dx); x=clamp(x+dx); apply(); });
  lab.addEventListener("pointerup",function(e){ dragging=false; lab.classList.remove("grabbing"); try{lab.releasePointerCapture(e.pointerId);}catch(_){} });
  lab.addEventListener("wheel",function(e){ if(curScene!=="street")return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){x=clamp(x-e.deltaX);}else{x=clamp(x-e.deltaY);} apply(); e.preventDefault(); },{passive:false});
  function nudge(d){ x=clamp(x+d); apply(); }
  edgeL.addEventListener("click",function(){nudge(window.innerWidth*0.5);});
  edgeR.addEventListener("click",function(){nudge(-window.innerWidth*0.5);});
  document.addEventListener("keydown",function(e){
    if(curScene==="street"){
      if(e.key==="ArrowLeft"){nudge(window.innerWidth*0.4);}
      if(e.key==="ArrowRight"){nudge(-window.innerWidth*0.4);}
    }
    if(e.key==="Escape"){ if(!lb.hidden){ closeLightbox(); } else if(curScene!=="street"){ goScene("street"); } }
  });

  /* ---- SCENES ---- */
  var curScene="street";
  var scenes={street:document.getElementById("sc-street"),binary:document.getElementById("sc-binary"),fallow:document.getElementById("sc-fallow")};
  var back=document.getElementById("back");
  function goScene(name){
    curScene=name;
    Object.keys(scenes).forEach(function(k){ scenes[k].classList.toggle("on",k===name); });
    back.hidden = (name==="street");
    mapEl.style.display = name==="street" ? "" : "none";
    document.querySelectorAll(".edge,.hint,.intro").forEach(function(el){ el.style.display = name==="street" ? "" : "none"; });
  }
  document.getElementById("hintBinary").addEventListener("click",function(){ goScene("binary"); });
  document.getElementById("hintFallow").addEventListener("click",function(){ goScene("fallow"); });
  back.addEventListener("click",function(){ goScene("street"); });
  document.querySelectorAll(".structure").forEach(function(st){
    function enter(){ var url=st.getAttribute("data-enter"); if(url) window.open(url,"_blank","noopener"); }
    st.addEventListener("click",enter);
    st.querySelector(".go").addEventListener("click",function(e){ e.stopPropagation(); enter(); });
  });

  window.addEventListener("resize",sizeWorld);
  sizeWorld();
  // center-start a touch in so the first piece isn't hard against the edge
  x=clamp(-worldW*0.02); apply();

  /* ---- cinematic intro: living city plays once, then fades to the walk ---- */
  (function(){
    var intro=document.getElementById("cityIntro");
    if(!intro) return;
    var v=document.getElementById("introVid");
    var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var done=false;
    function reveal(){ if(done)return; done=true; intro.classList.add("gone"); setTimeout(function(){ intro.style.display="none"; },1000); }
    document.getElementById("introSkip").addEventListener("click",reveal);
    if(reduce || !CFG.STREET_VIDEO){ reveal(); return; }
    v.src=CFG.STREET_VIDEO;
    v.addEventListener("ended",reveal);
    var p=v.play && v.play(); if(p && p.catch) p.catch(function(){});
    setTimeout(reveal, 8000); // safety: never trap the user
  })();
})();
</script>
</body>
</html>
