<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finite Appearances — riso art + type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     FINITE APPEARANCES — proven method, record 2.
     Generated riso art (cobalt / bone / red, no rainbow, no
     chrome) + real TYPE in bone & red on the flat blue zones.
     No accession codes, no barcode, no serial.
     ============================================================ */
  :root{
    --anton:'Anton',Impact,sans-serif; --mono:'Space Mono',monospace; --mark:'Reenie Beanie',cursive;
    --bone:#f1ece0; --red:#ef4a2e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#17171a;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,4vw,52px);font-family:var(--anton)}

  .poster{position:relative;width:min(540px,92vw);aspect-ratio:848/1264;overflow:hidden;color:var(--bone);
    background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260630_172035_10d1c702-6008-4631-a873-122b93bb0e53.png");
    background-size:cover;background-position:center;
    box-shadow:0 30px 70px -24px rgba(0,0,0,.7)}

  /* curatorial line, top */
  .hand{position:absolute;top:16px;left:15px;z-index:3;font-family:var(--mark);
    font-size:clamp(1.3rem,5vw,1.95rem);line-height:.96;width:78%;color:var(--bone);transform:rotate(-1.5deg)}
  .hand em{color:var(--red);font-style:normal}

  /* title + credit, bottom flat-blue zone */
  .title{position:absolute;left:15px;bottom:44px;z-index:3;font-family:var(--anton);
    font-size:clamp(2.3rem,9.5vw,3.5rem);line-height:.82;text-transform:uppercase;letter-spacing:-.01em;color:var(--bone)}
  .title span{display:block;color:var(--red)}
  .credit{position:absolute;left:16px;bottom:22px;z-index:3;font-family:var(--mono);font-size:.56rem;
    letter-spacing:.05em;text-transform:uppercase;color:var(--bone)}

  .cap{font-family:var(--mono);font-size:.62rem;color:#9a9a8a;text-align:center;margin-top:16px;letter-spacing:.04em;max-width:54ch;line-height:1.5}
</style>
</head>
<body>
  <article class="poster">
    <div class="hand">can a cast hold the feeling — <em>or only the shape it left?</em></div>

    <h1 class="title">Finite<span>Appearances</span></h1>
    <div class="credit">Kelly Holmes — Wil Aballe Art Projects, 2018</div>
  </article>
  <p class="cap">FINITE APPEARANCES · riso art (right-hand variant) + bone/red type on the flat cobalt zones · no chrome. Placement is a first pass on this art — say the word and I nudge.</p>
</body>
</html>
