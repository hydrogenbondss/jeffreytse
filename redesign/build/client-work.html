<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Work — Jeffrey N. Tse</title>
<meta name="description" content="Client Work — a stop-motion western cartoon. Scroll to ride: the cowboy Ash ropes each real client. Samsung · China Mobile · MTR · Disneyland · Ocean Park · Hong Kong Tourism Board · Heimtextil.">
<meta property="og:title" content="Client Work — Jeffrey N. Tse">
<meta property="og:description" content="A stop-motion western cartoon. Scroll to ride — the cowboy Ash ropes every real client.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,500&family=Rye&family=Smokum&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLIENT WORK · §04 — A STOP-MOTION WESTERN CARTOON, PROJECTED.
   Seven generated stop-motion clips (Ash ropes each real client,
   real logo baked into every frame). You SCROLL to scrub the reel:
   scroll = it plays, stop = it freezes, scroll back = it rewinds.
   Rings iris open at the top; Ash rides off into the next section.
   The clips carry their own sepia + grain; the page only adds a
   soft vignette + faint projector flicker, and the title cards.
   ============================================================ */
:root{
  --sepia:#2a1c0e; --card:#e9dcbe; --card2:#d8c49a; --amber:#c98a3a;
  --bone:#f4ead0; --ink:#241405;
  --cf:'https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/';
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:#0b0704}

#client{position:relative;background:#0b0704;color:var(--bone);
  font-family:'Cormorant Garamond',serif;-webkit-font-smoothing:antialiased}
#client .cw-track{position:relative;height:940vh}
#client .cw-stage{position:sticky;top:0;height:100vh;height:100dvh;width:100%;
  overflow:hidden;background:#0b0704}

/* the seven catch clips, stacked; only the active one is shown */
#client .cw-clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
  opacity:0;transition:opacity .55s ease;background:#0b0704}
#client .cw-clip.active{opacity:1;z-index:2}

/* soft light on the wall + faint projector flicker (the clips carry the grain) */
#client .cw-vig{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(125% 105% at 50% 47%,transparent 52%,rgba(18,10,3,.5) 86%,rgba(8,4,1,.8) 100%)}
#client .cw-flick{position:absolute;inset:0;z-index:5;pointer-events:none;background:rgba(255,236,200,.045);
  animation:flick 1.7s steps(1) infinite}
@keyframes flick{0%{opacity:0}12%{opacity:.08}26%{opacity:.02}40%{opacity:.10}55%{opacity:.03}70%{opacity:.08}86%{opacity:0}100%{opacity:.04}}

/* current client label (lower third) + reel marks */
#client .cw-act{position:absolute;left:5%;bottom:10%;z-index:8;max-width:60%;
  font-family:'Special Elite',monospace;font-size:clamp(.58rem,1.6vw,.78rem);
  letter-spacing:.18em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 6px #000;
  pointer-events:none;opacity:0;transition:opacity .35s ease}
#client .cw-act b{display:block;font-family:'Smokum',serif;letter-spacing:.04em;color:var(--amber);
  font-size:clamp(1.4rem,4vw,2.4rem);line-height:1;margin-top:.1em}
#client .cw-reel{position:absolute;top:4.5%;left:5%;z-index:8;pointer-events:none;
  font-family:'Special Elite',monospace;font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--amber);text-shadow:0 1px 5px #000}
#client .cw-meta{position:absolute;top:4.5%;right:5%;z-index:8;pointer-events:none;text-align:right;
  font-family:'Special Elite',monospace;font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;
  color:#cdb488;text-shadow:0 1px 5px #000}
#client .cw-meta b{color:var(--amber)}

/* ---------- LOONEY-TUNES-STYLE RING OPENING ---------- */
#client .cw-titlecard{position:absolute;inset:0;z-index:24;display:flex;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;overflow:hidden;color:var(--bone);
  background:repeating-radial-gradient(circle at 50% 47%,
    #d8b16a 0 2.6%, #b98d45 2.6% 5.2%, #8a6631 5.2% 7.8%, #b98d45 7.8% 10.4%);
  filter:sepia(.4) contrast(1.06)}
#client .cw-titlecard::before{content:"";position:absolute;inset:0;
  background:
    conic-gradient(from 0deg at 50% 47%, rgba(255,244,214,.16), transparent 22%, transparent 78%, rgba(255,244,214,.16)),
    radial-gradient(circle at 50% 47%, transparent 34%, rgba(12,7,3,.6) 100%);
  animation:ltsweep 6s linear infinite}
@keyframes ltsweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#client .cw-titlecard .lt-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.16em;
  padding:9% 12%;border-radius:50%/44%;
  background:radial-gradient(60% 62% at 50% 50%,rgba(18,11,4,.94) 0%,rgba(18,11,4,.82) 62%,rgba(18,11,4,0) 100%)}
#client .cw-titlecard .lt-inner::after{content:"";position:absolute;inset:14% 6%;border:2px solid rgba(244,234,208,.35);border-radius:50%/46%;pointer-events:none}
#client .tc-studio{font-family:'Rye',serif;font-size:clamp(.8rem,2.4vw,1.2rem);letter-spacing:.16em;color:#f4ead0}
#client .tc-tiny{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.7rem,1.8vw,1rem);color:#e2c98f}
#client .tc-feature{font-family:'Rye',serif;font-size:clamp(1.5rem,6.5vw,3.4rem);line-height:1;color:#f4ead0;
  letter-spacing:.01em;margin:.1em 0;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 26px rgba(201,138,58,.4)}
#client .tc-comic{font-family:'Smokum',serif;font-size:clamp(1.05rem,3.6vw,1.9rem);letter-spacing:.05em;color:var(--amber)}
#client .tc-sys{font-family:'Special Elite',monospace;font-size:clamp(.5rem,1.4vw,.64rem);letter-spacing:.24em;text-transform:uppercase;color:#cdb488;margin-top:.35em}

/* ---------- END CARD (Ash rides on -> next section) ---------- */
#client .cw-endcard{position:absolute;inset:0;z-index:26;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:.4em;
  background:radial-gradient(80% 80% at 50% 46%,#27190a,#120c05 70%,#070402);
  filter:grayscale(1) sepia(.55) contrast(1.05);transform:translateX(100%);opacity:0;will-change:transform,opacity}
#client .cw-endcard::before{content:"";position:absolute;inset:7%;border:2px double rgba(244,234,208,.4);border-radius:4px;pointer-events:none}
#client .ec-orn{font-family:'Rye',serif;color:var(--amber);font-size:clamp(1rem,3vw,1.5rem);opacity:.85}
#client .ec-big{font-family:'Rye',serif;font-size:clamp(2rem,9vw,4.6rem);color:var(--bone);line-height:.96;
  text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 26px rgba(201,138,58,.3)}
#client .ec-sub{font-family:'Smokum',serif;font-size:clamp(1.1rem,3.4vw,1.8rem);color:var(--amber);letter-spacing:.05em}
#client .ec-count{font-family:'Special Elite',monospace;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:#cdb488;margin-top:.4em}

/* scroll hint */
#client .cw-hint{position:absolute;left:0;right:0;bottom:5%;z-index:20;text-align:center;pointer-events:none;
  font-family:'Special Elite',monospace;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--bone);text-shadow:0 1px 6px #000;opacity:.9;transition:opacity .4s}
#client .cw-hint .chev{display:block;margin-top:6px;animation:bobHint 1.6s ease-in-out infinite}
@keyframes bobHint{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(5px);opacity:1}}
#client .cw-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- REDUCED-MOTION / TIGHT-SCREEN FALLBACK ---------- */
#client .cw-fallback{display:none}
#client.is-list .cw-track{height:auto}
#client.is-list .cw-stage{position:static;height:auto;min-height:0;overflow:visible;padding:clamp(28px,6vh,64px) 0}
#client.is-list .cw-clip,#client.is-list .cw-vig,#client.is-list .cw-flick,
#client.is-list .cw-act,#client.is-list .cw-reel,#client.is-list .cw-meta,
#client.is-list .cw-endcard,#client.is-list .cw-hint{display:none!important}
#client.is-list .cw-titlecard{position:relative;inset:auto;min-height:46vh;margin:0 auto clamp(18px,3vh,28px)}
#client .cw-fallback{margin:0 auto;max-width:820px;width:100%;padding:0 16px}
#client.is-list .cw-fallback{display:block}
#client .cw-fallback .fh{font-family:'Special Elite',monospace;font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;
  color:#cdb488;text-align:center;margin-bottom:16px}
#client .cw-fallback figure{margin:0 0 18px;border:1px solid rgba(36,20,5,.5);border-radius:6px;overflow:hidden;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.7);background:#1c130a}
#client .cw-fallback img{display:block;width:100%;height:auto}
#client .cw-fallback figcaption{font-family:'Smokum',serif;font-size:1.4rem;color:var(--amber);
  padding:8px 12px;letter-spacing:.03em}

#client .cw-foot{position:relative;z-index:30;text-align:center;padding:clamp(20px,4vh,40px) 0 clamp(28px,6vh,52px);
  font-family:'Special Elite',monospace;font-size:.56rem;letter-spacing:.26em;text-transform:uppercase;color:#8a7654}
#client .cw-foot a{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(201,138,58,.5)}
#client .cw-foot a:hover{color:var(--bone)}

@media (prefers-reduced-motion:reduce){
  #client .cw-flick,#client .cw-titlecard::before,#client .cw-hint .chev{animation:none!important}
}
</style>
</head>
<body>

<!-- ============ §04 · CLIENT WORK — STOP-MOTION WESTERN CARTOON ============ -->
<section id="client" aria-label="Client Work — a stop-motion western cartoon; scroll to ride and rope each client">
  <div class="cw-track" id="cwTrack">
    <div class="cw-stage" id="cwStage">
      <!-- seven catch clips injected here -->

      <div class="cw-vig" aria-hidden="true"></div>
      <div class="cw-flick" aria-hidden="true"></div>

      <div class="cw-reel" aria-hidden="true">Reel 04</div>
      <div class="cw-meta" id="cwMeta" aria-hidden="true">The Client Wrangler</div>
      <div class="cw-act" id="cwAct" aria-hidden="true"></div>

      <!-- ring opening -->
      <div class="cw-titlecard" id="cwTitle" role="img"
        aria-label="Ring title card: J. N. Tse Studios presents a Client-Work Cartoon — The Client Wrangler.">
        <div class="lt-inner">
          <span class="tc-studio">J&#183;N&#183;TSE STUDIOS</span>
          <span class="tc-tiny">presents</span>
          <span class="tc-feature">A CLIENT-WORK CARTOON</span>
          <span class="tc-comic">&ldquo;The Client Wrangler&rdquo;</span>
          <span class="tc-sys">in Sepia-Tone</span>
        </div>
      </div>

      <!-- ride-off end card -->
      <div class="cw-endcard" id="cwEnd" aria-hidden="true">
        <span class="ec-orn" aria-hidden="true">&#10070;</span>
        <span class="ec-big">Ash Rides On</span>
        <span class="ec-sub">The whole roster, roped</span>
        <span class="ec-count">7 of 7 captured</span>
      </div>

      <div class="cw-hint" id="cwHint">Scroll to ride<span class="chev" aria-hidden="true">&#9662;</span></div>
      <span class="cw-live" id="cwLive" aria-live="polite"></span>
    </div><!-- /cw-stage -->
  </div><!-- /cw-track -->

  <!-- REDUCED-MOTION / TIGHT-SCREEN FALLBACK: the seven catch stills -->
  <div class="cw-fallback" id="cwFallback"><div class="fh">The Roped Roster</div></div>

  <p class="cw-foot"><a href="#gate">↑ back to the Gate</a></p>
</section>

<script>
(function(){
  var CF='https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/';
  /* Seven clients. poster = the baked frame (real logo); clip = the stop-motion
     catch video. Leave clip '' and the poster still stands in until it's set. */
  var CATCH=[
    {client:'Samsung',                 poster:'hf_20260701_103114_c46398d1-a3f8-44fe-a2c4-93b94d7e741d.png', clip:'hf_20260701_125253_164775b4-7f15-47ae-ac87-e1cf59d145f3.mp4'},
    {client:'China Mobile',            poster:'hf_20260701_064033_282418fe-d38c-443f-8fd1-4c06519dd59f.png', clip:'hf_20260701_124622_cf3ed1c2-0630-4e68-9f3a-b08f3faa2949.mp4'},
    {client:'MTR',                     poster:'hf_20260701_094510_a2bdda19-67e9-4410-aa1d-6ab086c4f0e8.png', clip:'hf_20260701_125308_7fb99c71-67a2-4f13-ae0c-176588ed2924.mp4'},
    {client:'Disneyland',              poster:'hf_20260701_094514_82286d3c-2671-4a21-ab0b-1a80b22a7dee.png', clip:'hf_20260701_125334_398a41e6-ca0b-46f7-a8b4-7b145dd6cd6a.mp4'},
    {client:'Ocean Park',              poster:'hf_20260701_094519_8b681290-1976-48ae-9346-71b8b13d6d70.png', clip:'hf_20260701_125444_6617d29e-a542-4096-9b30-95f7e02680bd.mp4'},
    {client:'Hong Kong Tourism Board', poster:'hf_20260701_094522_f13a6064-4a2b-4e8e-b1bd-d9291460966b.png', clip:'hf_20260701_125450_2b051b14-06bf-4ca2-baa9-e36384c4602c.mp4'},
    {client:'Heimtextil',              poster:'hf_20260701_100532_dcc617cf-dc0e-4905-8eba-b7cd71ceae44.png', clip:'hf_20260701_125456_830d8301-51e4-4f09-a2d9-edaea631bfa9.mp4'}
  ];
  var N=CATCH.length;
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  var root=document.getElementById('client');
  var track=document.getElementById('cwTrack');
  var stage=document.getElementById('cwStage');
  var titleCard=document.getElementById('cwTitle');
  var endCard=document.getElementById('cwEnd');
  var actEl=document.getElementById('cwAct');
  var metaEl=document.getElementById('cwMeta');
  var hintEl=document.getElementById('cwHint');
  var liveEl=document.getElementById('cwLive');
  var fallback=document.getElementById('cwFallback');

  /* build the seven clip <video> elements (poster stands in until the clip loads) */
  var vids=CATCH.map(function(c,i){
    var v=document.createElement('video');
    v.className='cw-clip';
    v.muted=true; v.loop=false; v.playsInline=true; v.setAttribute('playsinline','');
    v.preload='auto';
    v.poster=CF+c.poster;
    v.setAttribute('aria-hidden','true');
    v.dataset.dur='0';
    if(c.clip){ v.src=CF+c.clip; v.addEventListener('loadedmetadata',function(){v.dataset.dur=v.duration||0;}); v.load(); }
    stage.insertBefore(v, stage.firstChild);
    return v;
  });

  /* fallback: the seven catch stills + names */
  CATCH.forEach(function(c){
    var f=document.createElement('figure');
    f.innerHTML='<img src="'+CF+esc(c.poster)+'" alt="Ash ropes '+esc(c.client)+'"><figcaption>'+esc(c.client)+'</figcaption>';
    fallback.appendChild(f);
  });

  /* ============================================================
     SCROLL-DRIVEN: rings iris -> seven scrubbed catch clips -> ride off
     ============================================================ */
  var INTRO_END=0.14, S0=0.14, S1=0.90, OUT0=0.90;
  var BAND=(S1-S0)/N;
  var ticking=false, cur=-1;

  function updateIntro(p){
    var iris=clamp((p-0.04)/0.09,0,1);
    titleCard.style.clipPath='circle('+((1-iris)*145).toFixed(1)+'% at 50% 47%)';
    titleCard.style.opacity=iris>=1?'0':'1';
    hintEl.style.opacity=p>0.03?'0':'0.9';
  }

  function showClip(idx){
    if(idx===cur) return;
    vids.forEach(function(v,k){ v.classList.toggle('active',k===idx); });
    cur=idx;
  }

  function updateCatch(p){
    if(p<S0){ showClip(reduce?0:0); vids.forEach(function(v){v.classList.remove('active');}); cur=-1;
      actEl.style.opacity='0'; metaEl.innerHTML='The Client Wrangler'; return; }
    if(p>=S1){ actEl.style.opacity='0'; metaEl.innerHTML='<b>The End</b> · '+N+' of '+N+' roped'; return; }
    var idx=clamp(Math.floor((p-S0)/BAND),0,N-1);
    var q=clamp((p-(S0+idx*BAND))/BAND,0,1);
    showClip(idx);
    /* SCRUB: scroll drives the frame; stop = freeze; back = rewind.
       Quantised to ~12fps so it steps like stop-motion. */
    var v=vids[idx], dur=parseFloat(v.dataset.dur)||0;
    if(dur>0){
      var t=Math.round(q*dur*12)/12;
      t=clamp(t,0,dur-0.02);
      if(Math.abs((v.currentTime||0)-t)>0.03){ try{ v.currentTime=t; }catch(e){} }
    }
    var c=CATCH[idx];
    actEl.style.opacity=(q>0.1&&q<0.94)?'1':'0';
    actEl.innerHTML='Ash ropes<b>'+esc(c.client)+'</b>';
    metaEl.innerHTML='Roped <b>'+(q>0.6?idx+1:idx)+'</b> of '+N;
    if(q>0.6){ liveEl.textContent=c.client+' roped — '+(idx+1)+' of '+N; }
  }

  function updateOutro(p){
    var o=clamp((p-OUT0)/(1-OUT0),0,1);
    endCard.style.transform='translateX('+((1-o)*100).toFixed(1)+'%)';
    endCard.style.opacity=o>0?'1':'0';
    if(cur>=0){ vids[cur].style.opacity=(1-o).toFixed(2); }
  }

  function apply(){
    ticking=false;
    var r=track.getBoundingClientRect();
    var total=track.offsetHeight-window.innerHeight;
    var p=total>0?clamp((-r.top)/total,0,1):0;
    updateIntro(p); updateCatch(p); updateOutro(p);
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(apply); } }

  /* responsive: scrub-show vs. static roster */
  var mode=null;
  function fitMode(){
    var tight=window.innerWidth<640||window.innerHeight<560||reduce;
    var want=tight?'list':'ride';
    if(want===mode) return;
    mode=want;
    if(tight){ root.classList.add('is-list'); window.removeEventListener('scroll',onScroll); }
    else{ root.classList.remove('is-list'); window.addEventListener('scroll',onScroll,{passive:true}); apply(); }
  }
  fitMode();
  var rTO; window.addEventListener('resize',function(){clearTimeout(rTO);rTO=setTimeout(function(){fitMode();if(mode==='ride')apply();},160);});
})();
</script>
</body>
</html>
