<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composite v5 — Ash rides the roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Smokum&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     COMPOSITE v5 — the full ride: transparent (luma-keyed) Ash
     travels a panning desert; the seven REAL client logos stand
     along the trail as painted signboards. Scroll = travel.
     Assets are LOCAL (assets/west/) — no CDN dependencies.
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{background:#d9c9a6}
  .track{position:relative;height:1200vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#d9c9a6}

  /* world: mirrored desert tiles + signboards, driven by scroll */
  .world{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
  .world .bg{display:block;height:100vh;width:auto;flex:none}
  .world .bg+.bg{margin-left:-2px}   /* hide the tile hairline */
  .world .bg.flip{transform:scaleX(-1)}

  .sign{position:absolute;top:24%;width:clamp(170px,16vw,290px);z-index:1;text-align:center}
  .sign .board{display:block;background:#e9dcbe;border:3px solid #5a3d1e;border-radius:3px;
    padding:12px 14px;box-shadow:0 4px 0 #5a3d1e,0 10px 18px -8px rgba(40,22,6,.55);
    transform:rotate(-1.2deg)}
  .sign:nth-of-type(even) .board{transform:rotate(1.4deg)}
  .sign .board img{display:block;width:100%;height:auto;max-height:88px;object-fit:contain;
    mix-blend-mode:multiply;filter:grayscale(1) sepia(.55) contrast(1.12)}
  .sign .post{display:block;margin:0 auto;width:10px;height:9vh;background:#5a3d1e;
    box-shadow:inset -2px 0 0 rgba(0,0,0,.28)}
  .sign figcaption{font-family:'Smokum',serif;color:#3a2412;font-size:clamp(.8rem,1.5vw,1.15rem);
    letter-spacing:.04em;margin-top:2px;text-shadow:0 1px 0 rgba(244,234,208,.6)}

  /* fast foreground dirt (parallax = speed) */
  .dust{position:absolute;left:0;bottom:0;width:400%;height:16%;z-index:2;pointer-events:none;
    will-change:transform;opacity:.55;
    background-image:
      radial-gradient(2px 2px at 5% 60%,rgba(60,40,18,.8),transparent),
      radial-gradient(3px 3px at 12% 80%,rgba(60,40,18,.7),transparent),
      radial-gradient(2px 2px at 20% 40%,rgba(60,40,18,.7),transparent),
      radial-gradient(4px 2px at 30% 70%,rgba(60,40,18,.6),transparent),
      radial-gradient(2px 2px at 41% 85%,rgba(60,40,18,.7),transparent),
      radial-gradient(3px 3px at 55% 55%,rgba(60,40,18,.6),transparent),
      radial-gradient(2px 2px at 67% 78%,rgba(60,40,18,.7),transparent),
      radial-gradient(3px 3px at 80% 45%,rgba(60,40,18,.6),transparent),
      radial-gradient(2px 2px at 92% 72%,rgba(60,40,18,.7),transparent);
    background-size:25% 100%}

  /* Ash: canvas = luma-keyed (solid); video = multiply fallback if keying fails */
  .ash{position:absolute;left:2%;bottom:4%;height:70%;width:auto;z-index:3;pointer-events:none}
  #ashVideo{display:none;mix-blend-mode:multiply}
  #ashVideo.fallback{display:block}
  #ashCanvas.hidden{display:none}

  .wash{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 48%,transparent 56%,rgba(24,13,3,.32) 100%)}

  /* roster meta (top) + current client (lower third) */
  .meta{position:absolute;top:4.5%;right:5%;z-index:6;pointer-events:none;text-align:right;
    font-family:'Special Elite',monospace;font-size:.6rem;letter-spacing:.24em;
    text-transform:uppercase;color:#3a2412;opacity:.85}
  .act{position:absolute;left:5%;bottom:11%;z-index:6;pointer-events:none;
    font-family:'Special Elite',monospace;font-size:.68rem;letter-spacing:.18em;
    text-transform:uppercase;color:#3a2412;opacity:0;transition:opacity .35s ease}
  .act b{display:block;font-family:'Smokum',serif;letter-spacing:.04em;color:#7c3f11;
    font-size:clamp(1.3rem,3.6vw,2.2rem);line-height:1.05;margin-top:.12em}

  .hint{position:absolute;left:0;right:0;bottom:5%;z-index:6;text-align:center;pointer-events:none;
    font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:#3a2412;opacity:.7;transition:opacity .4s}
  .note{position:absolute;left:12px;top:10px;z-index:9;color:#3a2412;font-family:'Special Elite',monospace;
    font-size:11px;background:rgba(244,234,208,.7);padding:5px 8px;border-radius:4px}
</style>
</head>
<body>
  <div class="track" id="track">
    <div class="stage">
      <div class="world" id="world">
        <img class="bg" src="assets/west/desert.png" alt="">
        <img class="bg flip" src="assets/west/desert.png" alt="">
        <img class="bg" src="assets/west/desert.png" alt="">
        <img class="bg flip" src="assets/west/desert.png" alt="">
        <!-- seven signboards, spaced along the trail; JS sets left -->
      </div>
      <div class="dust" id="dust"></div>
      <canvas id="ashCanvas" class="ash"></canvas>
      <video id="ashVideo" class="ash" autoplay muted loop playsinline
        src="assets/west/ash_ride.mp4"></video>
      <div class="wash"></div>
      <div class="meta" id="meta">The Client Trail</div>
      <div class="act" id="act"></div>
      <div class="hint" id="hint">scroll to ride ▾</div>
      <div class="note">v5 — full roster, local assets, luma-keyed Ash</div>
    </div>
  </div>

<script>
(function(){
  /* the seven real clients, in trail order */
  var ROSTER=[
    {client:'Samsung',                 logo:'assets/west/logos/samsung.png'},
    {client:'China Mobile',            logo:'assets/west/logos/china-mobile.png'},
    {client:'MTR',                     logo:'assets/west/logos/mtr.png'},
    {client:'Disneyland',              logo:'assets/west/logos/disneyland.png'},
    {client:'Ocean Park',              logo:'assets/west/logos/ocean-park.png'},
    {client:'Hong Kong Tourism Board', logo:'assets/west/logos/hktb.png'},
    {client:'Heimtextil',              logo:'assets/west/logos/heimtextil.jpg'}
  ];
  var N=ROSTER.length;
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};

  var track=document.getElementById('track'), world=document.getElementById('world'),
      dust=document.getElementById('dust'), v=document.getElementById('ashVideo'),
      cv=document.getElementById('ashCanvas'), meta=document.getElementById('meta'),
      act=document.getElementById('act'), hint=document.getElementById('hint');
  var ctx=cv.getContext('2d',{willReadFrequently:true}), keyed=true, ticking=false;

  /* place the signboards evenly along the world (first ~8% is Ash's runway) */
  ROSTER.forEach(function(c,i){
    var f=document.createElement('figure');
    f.className='sign';
    f.style.left=(10+i*(84/(N-1))).toFixed(2)+'%';
    f.innerHTML='<span class="board"><img src="'+esc(c.logo)+'" alt="'+esc(c.client)+'"></span>'+
      '<span class="post"></span><figcaption>'+esc(c.client)+'</figcaption>';
    world.appendChild(f);
  });

  /* ---- scroll-driven travel; the nearest signboard names the client ---- */
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(apply); } }
  function apply(){
    ticking=false;
    var total=track.offsetHeight-window.innerHeight;
    var p=total>0?clamp((-track.getBoundingClientRect().top)/total,0,1):0;
    var maxPan=Math.max(0, world.scrollWidth - window.innerWidth);
    world.style.transform='translateX('+(-p*maxPan).toFixed(1)+'px)';
    dust.style.transform='translateX('+(-(p*maxPan*1.7) % window.innerWidth).toFixed(1)+'px)';
    hint.style.opacity=p>0.02?'0':'0.7';
    /* which sign sits nearest Ash right now? */
    var idx=clamp(Math.round((p*84)/(84/(N-1))),0,N-1);
    if(p<0.02){ act.style.opacity='0'; meta.textContent='The Client Trail'; }
    else{
      act.style.opacity='1';
      act.innerHTML='Riding past<b>'+esc(ROSTER[idx].client)+'</b>';
      meta.textContent='Client '+(idx+1)+' of '+N;
    }
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',apply);

  /* ---- Ash: luma-key the white background to true transparency ---- */
  function fallback(){ keyed=false; cv.classList.add('hidden'); v.classList.add('fallback'); }
  function frame(){
    if(v.readyState>=2 && v.videoWidth){
      if(cv.width!==v.videoWidth){ cv.width=v.videoWidth; cv.height=v.videoHeight; }
      ctx.drawImage(v,0,0,cv.width,cv.height);
      if(keyed){
        try{
          var im=ctx.getImageData(0,0,cv.width,cv.height), d=im.data, mn;
          for(var i=0;i<d.length;i+=4){
            mn=Math.min(d[i],d[i+1],d[i+2]);
            if(mn>=248){ d[i+3]=0; } else if(mn>224){ d[i+3]=Math.round(255*(248-mn)/24); }
          }
          ctx.putImageData(im,0,0);
        }catch(e){ fallback(); }
      }
    }
    requestAnimationFrame(frame);
  }
  /* start the key-loop unconditionally (frame() guards readyState itself) so a
     fast local load can't race the loadeddata listener; retry play on gesture */
  function kick(){ var pr=v.play(); if(pr&&pr.catch)pr.catch(function(){}); }
  v.addEventListener('error',fallback);
  kick(); frame();
  document.addEventListener('scroll',kick,{passive:true,once:true});
  document.addEventListener('click',kick,{once:true});
  apply();
})();
</script>
</body>
</html>
