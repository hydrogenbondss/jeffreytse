<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composite test v2 — multiply Ash / desert / logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#d9c9a6;overflow:hidden}
  .stage{position:fixed;inset:0;overflow:hidden;background:#d9c9a6}

  /* LAYER 1+3 — the desert AND the logo pan together (logo rides on its sign) */
  .world{position:absolute;top:0;left:0;height:100%;width:auto;
    animation:pan 22s linear infinite alternate;will-change:transform}
  @keyframes pan{from{transform:translateX(0)}to{transform:translateX(-22%)}}
  .world .bg{display:block;height:100vh;width:auto}
  /* the real logo, toned to the sepia world and centered on the sign board,
     multiply so it reads as printed onto the weathered wood */
  .world .logo{position:absolute;left:73.5%;top:18%;width:16%;
    mix-blend-mode:multiply;filter:grayscale(1) sepia(.6) contrast(1.08) brightness(.9)}

  /* LAYER 2 — Ash on WHITE, composited with multiply so the white vanishes */
  .ash{position:absolute;left:1%;bottom:3%;height:70%;width:auto;object-fit:contain;
    z-index:3;pointer-events:none;mix-blend-mode:multiply}

  /* faint sepia vignette to marry the layers */
  .wash{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 48%,transparent 56%,rgba(24,13,3,.34) 100%)}

  .note{position:absolute;left:12px;bottom:10px;z-index:9;color:#3a2412;font-family:monospace;
    font-size:11px;letter-spacing:.06em;background:rgba(244,234,208,.7);padding:6px 9px;border-radius:4px}
</style>
</head>
<body>
  <div class="stage">
    <div class="world">
      <img class="bg" src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_150521_c925652b-4de6-4f93-937d-63b66baf00d2.png" alt="">
      <img class="logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/be4ad68b-0ff9-43be-a356-6a0ecbbc1340.png" alt="China Mobile">
    </div>
    <video class="ash" src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_182029_2487a391-f525-4c31-a73f-9ee734ceae81.mp4" autoplay muted loop playsinline></video>
    <div class="wash"></div>
    <div class="note">composite v2 — desert+logo pan together, Ash on white via multiply</div>
  </div>
</body>
</html>
