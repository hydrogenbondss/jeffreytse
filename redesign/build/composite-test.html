<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composite test v3 — luma-keyed Ash / desert / logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#d9c9a6;overflow:hidden}
  .stage{position:fixed;inset:0;overflow:hidden;background:#d9c9a6}

  /* desert + logo pan together */
  .world{position:absolute;top:0;left:0;height:100%;width:auto;
    animation:pan 22s linear infinite alternate;will-change:transform}
  @keyframes pan{from{transform:translateX(0)}to{transform:translateX(-22%)}}
  .world .bg{display:block;height:100vh;width:auto}
  /* real logo, toned to sepia, dropped onto the sign (multiply, no brightness box) */
  .world .logo{position:absolute;left:74%;top:19%;width:15%;
    mix-blend-mode:multiply;filter:grayscale(1) sepia(.55) contrast(1.12)}

  /* Ash: canvas is the luma-keyed (fully opaque) version;
     the <video> is a multiply fallback only used if the keying is blocked. */
  .ash{position:absolute;left:1%;bottom:3%;height:70%;width:auto;z-index:3;pointer-events:none}
  #ashVideo{display:none;mix-blend-mode:multiply}
  #ashVideo.fallback{display:block}
  #ashCanvas.hidden{display:none}

  .wash{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 48%,transparent 56%,rgba(24,13,3,.34) 100%)}
  .note{position:absolute;left:12px;bottom:10px;z-index:9;color:#3a2412;font-family:monospace;
    font-size:11px;letter-spacing:.06em;background:rgba(244,234,208,.7);padding:6px 9px;border-radius:4px}
</style>
</head>
<body>
  <div class="stage">
    <div class="world">
      <img class="bg" src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_150521_c925652b-4de6-4f93-937d-63b66baf00d2.png" alt="">
      <img class="logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/be4ad68b-0ff9-43be-a356-6a0ecbbc1340.png" alt="China Mobile">
    </div>

    <canvas id="ashCanvas" class="ash"></canvas>
    <video id="ashVideo" class="ash" crossorigin="anonymous" autoplay muted loop playsinline
      src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_182029_2487a391-f525-4c31-a73f-9ee734ceae81.mp4"></video>

    <div class="wash"></div>
    <div class="note" id="note">composite v3 — luma-keyed Ash (solid) + real logo</div>
  </div>

<script>
(function(){
  var v=document.getElementById('ashVideo');
  var cv=document.getElementById('ashCanvas');
  var note=document.getElementById('note');
  var ctx=cv.getContext('2d',{willReadFrequently:true});
  var keyed=true;

  function fallbackToMultiply(){
    keyed=false;
    cv.classList.add('hidden');
    v.classList.add('fallback');
    note.textContent='composite v3 — keying blocked (CORS); showing multiply fallback';
  }

  function frame(){
    if(v.readyState>=2 && v.videoWidth){
      if(cv.width!==v.videoWidth){ cv.width=v.videoWidth; cv.height=v.videoHeight; }
      ctx.drawImage(v,0,0,cv.width,cv.height);
      if(keyed){
        try{
          var im=ctx.getImageData(0,0,cv.width,cv.height), d=im.data;
          for(var i=0;i<d.length;i+=4){
            var mn=Math.min(d[i],d[i+1],d[i+2]);      // how "white" the pixel is
            if(mn>=248){ d[i+3]=0; }                   // near-pure white -> fully transparent
            else if(mn>224){ d[i+3]=Math.round(255*(248-mn)/24); } // soft edge
          }
          ctx.putImageData(im,0,0);
        }catch(e){ fallbackToMultiply(); }
      }
    }
    requestAnimationFrame(frame);
  }

  v.addEventListener('loadeddata',function(){ var p=v.play(); if(p&&p.catch)p.catch(function(){}); frame(); });
  v.addEventListener('error',fallbackToMultiply);
  // if metadata never reads cross-origin, browsers can still play but taint the canvas -> handled in try/catch
})();
</script>
</body>
</html>
