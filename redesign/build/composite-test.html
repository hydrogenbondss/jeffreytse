<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composite test — Ash / desert / logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0704;overflow:hidden}
  .stage{position:fixed;inset:0;overflow:hidden}

  /* LAYER 1 — desert background, slowly panning (fakes the travel) */
  .bg{position:absolute;top:0;left:0;height:100%;width:auto;min-width:180%;
    object-fit:cover;animation:pan 24s linear infinite alternate;will-change:transform}
  @keyframes pan{from{transform:translateX(0)}to{transform:translateX(-40%)}}

  /* LAYER 2 — the background-removed Ash, looping on top.
     If the cutout is truly transparent, the desert shows through. */
  .ash{position:absolute;left:4%;bottom:2%;height:78%;width:auto;object-fit:contain;
    z-index:2;pointer-events:none}

  /* LAYER 3 — the REAL logo PNG, blended onto the blank sign (crisp, guaranteed).
     multiply makes it read as painted onto the weathered wood. */
  .logo{position:absolute;right:14.5%;top:28%;width:12%;z-index:3;
    mix-blend-mode:multiply;pointer-events:none;
    filter:sepia(.3) contrast(1.02)}

  /* a faint sepia film wash to marry the layers */
  .wash{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 46%,transparent 55%,rgba(20,10,2,.4) 100%)}

  .note{position:absolute;left:12px;bottom:10px;z-index:9;color:#f4ead0;font-family:monospace;
    font-size:11px;letter-spacing:.08em;background:rgba(10,6,3,.55);padding:6px 9px;border-radius:4px}
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_150521_c925652b-4de6-4f93-937d-63b66baf00d2.png" alt="">
    <video class="ash" src="https://d8j0ntlcm91z4.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/hf_20260701_155837_da3dd31a-6356-4562-a373-d70415c67bcb.mp4" autoplay muted loop playsinline></video>
    <img class="logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3D9n01XOnau0mp9G8sIiSIuAWCf/be4ad68b-0ff9-43be-a356-6a0ecbbc1340.png" alt="China Mobile">
    <div class="wash"></div>
    <div class="note">composite test — desert (pan) + transparent Ash + real logo (multiply)</div>
  </div>
</body>
</html>
