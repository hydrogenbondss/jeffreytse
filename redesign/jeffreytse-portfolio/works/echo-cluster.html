<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO — Works cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1714;
    --paper:#e9e0cf;
    --paper-2:#ded2bb;
    --hand:'Caveat','Kalam','Segoe Script','Bradley Hand',cursive;
    --tape:rgba(214,204,176,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:#34302a;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 16px;
    font-family:var(--hand);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- paper panel ---------- */
  .echo-wrap{
    position:relative;
    width:min(820px,94vw);
    padding:34px 30px 42px;
    border-radius:3px;
    background:
      radial-gradient(120% 90% at 18% 8%, #efe7d6 0%, var(--paper) 42%, var(--paper-2) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 30px 60px -20px rgba(0,0,0,.55),
      0 6px 16px rgba(0,0,0,.3);
  }
  /* paper grain */
  .echo-wrap::before{
    content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
    opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }
  /* soft edge darkening */
  .echo-wrap::after{
    content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
    box-shadow:0 0 70px rgba(60,45,30,.18) inset;
  }

  /* ---------- the cluster stage ---------- */
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/11;
  }
  .stage > *{position:absolute;}

  /* ---------- generic photo treatments ---------- */
  .photo{
    background:#fff;
    padding:8px 8px 8px;
    box-shadow:0 10px 22px -8px rgba(20,12,6,.55), 0 2px 4px rgba(0,0,0,.25);
  }
  .photo .frame{
    position:relative;overflow:hidden;background:#0c0c0e;
    width:100%;height:100%;
  }
  .photo img,.photo video{
    display:block;width:100%;height:100%;object-fit:cover;
  }
  /* print sheen + vignette over any photo */
  .photo .frame::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 30%),
      radial-gradient(120% 120% at 50% 40%, transparent 55%, rgba(0,0,0,.28) 100%);
  }

  /* polaroid variant */
  .polaroid{padding:9px 9px 30px;}

  /* torn-edge variant */
  .torn{
    padding:6px;
    clip-path:polygon(0% 4%,7% 0%,22% 3%,38% 0%,55% 4%,72% 1%,88% 3%,100% 0%,
                      99% 22%,100% 44%,98% 62%,100% 80%,99% 100%,
                      80% 98%,62% 100%,44% 97%,26% 100%,9% 98%,0% 100%,
                      1% 80%,0% 60%,2% 40%,0% 20%);
  }

  /* ---------- washi tape ---------- */
  .tape{
    position:absolute;width:88px;height:26px;z-index:6;
    background:
      linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.05)),
      var(--tape);
    box-shadow:0 1px 2px rgba(0,0,0,.18);
    opacity:.92;
  }
  .tape::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='1'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23t)'/></svg>");}
  .tape.blue{--tape:rgba(150,170,182,.5);}
  .tape.amber{--tape:rgba(214,180,120,.55);}

  /* ============ PLACED PHOTOS ============ */

  /* SLOT: darkroom — the LIVING photo (real asset) */
  .p-darkroom{
    left:2%;top:14%;width:46%;aspect-ratio:16/9;
    transform:rotate(-3.2deg);z-index:4;
  }
  .p-darkroom .tape.t1{left:-14px;top:-12px;transform:rotate(-24deg);}
  .p-darkroom .tape.t2{right:-12px;bottom:18px;transform:rotate(-8deg);width:70px;}
  .live-note{
    position:absolute;right:-6px;bottom:-22px;z-index:7;
    font-family:var(--hand);font-size:19px;color:#3a322a;transform:rotate(-4deg);
    white-space:nowrap;opacity:.85;
  }
  .live-note::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#d8442e;margin-right:6px;vertical-align:middle;
    box-shadow:0 0 8px 2px rgba(216,68,46,.7);animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}

  /* SLOT: neo_snap_rooftop_mid — empty named frame (cool/blue) */
  .p-rooftop{
    right:3%;top:6%;width:42%;aspect-ratio:3/2;
    transform:rotate(2.4deg);z-index:5;
  }
  .p-rooftop .tape.t1{left:30%;top:-13px;transform:rotate(6deg);}

  /* SLOT: apartment_day — empty named frame (warm daylight) */
  .p-apartment{
    left:24%;bottom:1%;width:40%;aspect-ratio:4/3;
    transform:rotate(-1.6deg);z-index:5;
  }
  .p-apartment .tape.t1{left:-13px;top:34%;transform:rotate(-78deg);width:74px;}

  /* empty-slot styling: real frame awaiting a real scene */
  .empty .frame{
    background:#cdbcae;
    display:flex;align-items:center;justify-content:center;text-align:center;
  }
  .empty.cool .frame{background:linear-gradient(160deg,#243446,#0f1a24);}
  .empty.warm .frame{background:linear-gradient(160deg,#e6c79a,#b98a5c);}
  .empty .frame::before{
    content:"";position:absolute;inset:9px;border:1.5px dashed rgba(255,255,255,.35);
    border-radius:2px;pointer-events:none;
  }
  .empty .slot-tag{
    position:relative;z-index:2;font-family:var(--hand);
    color:rgba(255,255,255,.92);line-height:1.15;
    text-shadow:0 1px 3px rgba(0,0,0,.5);padding:0 10px;
  }
  .empty .slot-tag b{display:block;font-size:21px;letter-spacing:.3px;}
  .empty .slot-tag span{font-size:14px;opacity:.8;}
  .empty .slot-tag i{display:block;margin-top:6px;font-size:13px;opacity:.7;font-style:normal;}

  /* ---------- ink lettering ---------- */
  .ink-echo{
    left:1%;bottom:2%;z-index:9;
    font-family:var(--hand);font-weight:700;color:var(--ink);
    font-size:clamp(46px,9vw,84px);line-height:.8;transform:rotate(-4deg);
    text-shadow:0 1px 0 rgba(255,255,255,.25);
  }
  .ink-echo .sub{
    display:block;font-weight:500;font-size:.30em;margin-top:.18em;margin-left:.25em;
    transform:rotate(1.5deg);opacity:.82;letter-spacing:.5px;
  }
  .heart{
    position:absolute;z-index:9;right:30%;top:50%;
    width:26px;height:24px;transform:rotate(12deg);
  }
  .heart svg{display:block;width:100%;height:100%;}
  .arrow{position:absolute;z-index:9;left:31%;top:36%;width:120px;height:60px;
    transform:rotate(8deg);opacity:.7;}
  .stamp{
    position:absolute;z-index:8;right:6%;bottom:8%;
    border:2px solid #7a3b32;color:#7a3b32;border-radius:3px;
    font-family:var(--hand);font-weight:700;font-size:15px;letter-spacing:1px;
    padding:5px 9px;transform:rotate(-9deg);opacity:.62;
    text-transform:uppercase;
  }

  @media(max-width:560px){
    .ink-echo{font-size:46px;}
    .live-note{font-size:16px;}
  }
</style>
</head>
